name: quantfoundry

x-backend-env: &backend-env
  QF_ENV: ${QF_ENV:?missing QF_ENV}
  QF_ENVIRONMENT: ${QF_ENVIRONMENT:?missing QF_ENVIRONMENT}
  QF_GIT_COMMIT: ${QF_GIT_COMMIT:?missing QF_GIT_COMMIT}
  QF_BUILD_ID: ${QF_BUILD_ID:?missing QF_BUILD_ID}
  QF_ARTIFACT_ROOT: /var/lib/quantfoundry/artifacts
  QF_ARTIFACT_DIR: /var/lib/quantfoundry/artifacts
  QF_DATA_ROOT: /var/lib/quantfoundry/data
  QF_DATASET_DIR: /var/lib/quantfoundry/data/datasets
  QF_COST_MODEL_DIR: /var/lib/quantfoundry/data/cost-models
  QF_POLICY_DIR: /var/lib/quantfoundry/data/policies
  QF_TOOL_CONTRACT_PATH: /workspace/docs/后端系统技术方案/contracts/tools/v1-p0.yaml
  QF_CREDENTIAL_ENCRYPTION_KEY_ID: ${QF_CREDENTIAL_ENCRYPTION_KEY_ID:?missing QF_CREDENTIAL_ENCRYPTION_KEY_ID}
  QF_CREDENTIAL_ENCRYPTION_KEY: ${QF_CREDENTIAL_ENCRYPTION_KEY:?missing QF_CREDENTIAL_ENCRYPTION_KEY}
  QF_CREDENTIAL_FINGERPRINT_KEY: ${QF_CREDENTIAL_FINGERPRINT_KEY:?missing QF_CREDENTIAL_FINGERPRINT_KEY}
  QF_CREDENTIAL_ENCRYPTION_KEYS: ${QF_CREDENTIAL_ENCRYPTION_KEYS-}

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: deploy/Dockerfile.backend
    args:
      QF_GIT_COMMIT: ${QF_GIT_COMMIT:?missing QF_GIT_COMMIT}
      QF_BUILD_ID: ${QF_BUILD_ID:?missing QF_BUILD_ID}
  environment:
    <<: *backend-env
  volumes:
    - quantfoundry-artifacts:/var/lib/quantfoundry/artifacts
    - quantfoundry-data:/var/lib/quantfoundry/data
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

x-migration-env: &migration-env
  QF_DATABASE_URL: postgresql+psycopg://${QF_POSTGRES_USER:?missing QF_POSTGRES_USER}:${QF_POSTGRES_PASSWORD:?missing QF_POSTGRES_PASSWORD}@postgres:5432/${QF_POSTGRES_DB:?missing QF_POSTGRES_DB}
  QF_ALEMBIC_URL: postgresql+psycopg://${QF_POSTGRES_USER:?missing QF_POSTGRES_USER}:${QF_POSTGRES_PASSWORD:?missing QF_POSTGRES_PASSWORD}@postgres:5432/${QF_POSTGRES_DB:?missing QF_POSTGRES_DB}
  QF_SKIP_AUTO_CREATE: "1"

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    environment:
      POSTGRES_DB: ${QF_POSTGRES_DB:?missing QF_POSTGRES_DB}
      POSTGRES_USER: ${QF_POSTGRES_USER:?missing QF_POSTGRES_USER}
      POSTGRES_PASSWORD: ${QF_POSTGRES_PASSWORD:?missing QF_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  migrate:
    <<: *backend-common
    environment:
      <<: [*backend-env, *migration-env]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: ["sh", "-ec", "python scripts/ux001_domain_preflight.py --migrate && alembic check && python scripts/ux001_domain_preflight.py && python scripts/migrate_control_db.py"]

  storage-init:
    <<: *backend-common
    user: "0:0"
    read_only: true
    restart: "no"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - sh
      - -ec
      - >-
        mkdir -p
        /var/lib/quantfoundry/artifacts
        /var/lib/quantfoundry/data/datasets
        /var/lib/quantfoundry/data/cost-models
        /var/lib/quantfoundry/data/policies
        && chown -R quantfoundry:quantfoundry
        /var/lib/quantfoundry/artifacts
        /var/lib/quantfoundry/data
        && chmod 0750
        /var/lib/quantfoundry/artifacts
        /var/lib/quantfoundry/data
        /var/lib/quantfoundry/data/datasets
        /var/lib/quantfoundry/data/cost-models
        /var/lib/quantfoundry/data/policies

  local-provider:
    profiles: ["local"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        QF_GIT_COMMIT: ${QF_GIT_COMMIT:?missing QF_GIT_COMMIT}
        QF_BUILD_ID: ${QF_BUILD_ID:?missing QF_BUILD_ID}
    environment:
      QF_ENV: ${QF_ENV:?missing QF_ENV}
      QF_ENVIRONMENT: ${QF_ENVIRONMENT:?missing QF_ENVIRONMENT}
      QF_LOCAL_PROVIDER_API_KEY: ${QF_LOCAL_PROVIDER_API_KEY:-}
    command: ["python", "-m", "app.local_provider", "--host", "0.0.0.0", "--port", "8011"]
    expose: ["8011"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    <<: *backend-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      local-provider:
        condition: service_healthy
        required: false
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "/workspace/scripts/api_healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *backend-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      QF_WORKER_KIND: core
    command: ["python", "-m", "quantfoundry.workers.main"]
    healthcheck:
      test: ["CMD", "python", "/workspace/scripts/runtime_healthcheck.py", "--component", "worker", "--queue", "core"]
      interval: 15s
      timeout: 30s
      retries: 8
      start_period: 15s

  agent-worker:
    <<: *backend-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      local-provider:
        condition: service_healthy
        required: false
    environment:
      <<: *backend-env
      QF_WORKER_KIND: agent
    command: ["python", "-m", "quantfoundry.workers.main"]
    healthcheck:
      test: ["CMD", "python", "/workspace/scripts/runtime_healthcheck.py", "--component", "worker", "--queue", "agent"]
      interval: 15s
      timeout: 30s
      retries: 8
      start_period: 15s

  scheduler:
    <<: *backend-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
    command: ["python", "-m", "quantfoundry.scheduler.main"]
    healthcheck:
      test: ["CMD", "python", "/workspace/scripts/runtime_healthcheck.py", "--component", "scheduler"]
      interval: 15s
      timeout: 30s
      retries: 8
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        QF_GIT_COMMIT: ${QF_GIT_COMMIT:?missing QF_GIT_COMMIT}
        QF_BUILD_ID: ${QF_BUILD_ID:?missing QF_BUILD_ID}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${QF_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  quantfoundry-artifacts:
  quantfoundry-data:
