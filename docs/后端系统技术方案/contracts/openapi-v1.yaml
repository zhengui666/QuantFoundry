      required: [approval_id, type, subject, requester, reason, prerequisites, risk_summary, effects, status, requested_at, decided_at, revision, action_capabilities]
      properties:
        approval_id: *ApprovalIdSchema
        type: {enum: [HOLDOUT_UNLOCK, PAPER_DEPLOYMENT, PAPER_ALLOCATION_CHANGE, RETIRE_PAPER]}
        subject: {$ref: '#/components/schemas/ApprovalSubject'}
        requester: {$ref: '#/components/schemas/RequesterRef'}
        reason: {type: string}
        prerequisites: {type: array, items: {$ref: '#/components/schemas/ApprovalPrerequisite'}}
        risk_summary: {$ref: '#/components/schemas/RiskSummary'}
        effects: {type: array, items: {$ref: '#/components/schemas/ApprovalEffect'}}
        status: {enum: [PENDING, APPROVED, REJECTED, STALE, CANCELLED]}
        requested_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
