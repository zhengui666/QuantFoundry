        tests: {type: array, items: {$ref: '#/components/schemas/ValidationTestResult'}}
        warnings: {type: array, items: {type: string}}
        failures: {type: array, items: {type: string}}
        holdout_state: {enum: [LOCKED, APPROVAL_PENDING, UNLOCKED, RUNNING, EXPOSED, FAILED]}
        red_team_run_id: {oneOf: [*RedTeamRunId, {type: 'null'}]}
        job_id: {oneOf: [*JobIdSchema, {type: 'null'}]}
        revision: {type: integer, minimum: 1}
        action_capabilities: {type: array, items: {$ref: '#/components/schemas/ActionCapability'}}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
