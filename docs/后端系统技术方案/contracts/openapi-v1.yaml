        selected_parameters: {type: array, maxItems: 0}
        selected_metric: {type: 'null'}
        result_ref: {type: 'null'}
        failure_code: {type: 'null'}
    ExperimentSearchResultPending:
      type: object
      additionalProperties: false
      required: [state, evaluated_count, selected_parameters, selected_metric, result_ref, failure_code]
      properties:
        state: {const: PENDING}
        evaluated_count: {type: integer, const: 0}
        selected_parameters: {type: array, maxItems: 0}
        selected_metric: {type: 'null'}
        result_ref: {type: 'null'}
        failure_code: {type: 'null'}
    ExperimentSearchResultRunning:
      type: object
      additionalProperties: false
      required: [state, evaluated_count, selected_parameters, selected_metric, result_ref, failure_code]
      properties:
        state: {const: RUNNING}
        evaluated_count: {type: integer, minimum: 0}
        selected_parameters: {type: array, maxItems: 0}
        selected_metric: {type: 'null'}
        result_ref: {type: 'null'}
        failure_code: {type: 'null'}
    ExperimentSearchResultCompleted:
      type: object
      additionalProperties: false
      required: [state, evaluated_count, selected_parameters, selected_metric, result_ref, failure_code]
      properties:
        state: {const: COMPLETED}
        evaluated_count: {type: integer, minimum: 1}
        selected_parameters: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Parameter'}}
        selected_metric: {$ref: '#/components/schemas/Metric'}
        result_ref: {$ref: '#/components/schemas/ObjectRef'}
        failure_code: {type: 'null'}
    ExperimentSearchResultFailed:
      type: object
      additionalProperties: false
      required: [state, evaluated_count, selected_parameters, selected_metric, result_ref, failure_code]
      properties:
        state: {const: FAILED}
        evaluated_count: {type: integer, minimum: 0}
        selected_parameters: {type: array, maxItems: 0}
        selected_metric: {type: 'null'}
        result_ref: {type: 'null'}
        failure_code: {$ref: '#/components/schemas/CanonicalErrorCode'}
    ExperimentSearchResult:
      description: State-discriminated Search result; every branch is closed and excludes contradictory partial success/failure fields.
      discriminator:
        propertyName: state
        mapping:
          NOT_APPLICABLE: '#/components/schemas/ExperimentSearchResultNotApplicable'
          PENDING: '#/components/schemas/ExperimentSearchResultPending'
          RUNNING: '#/components/schemas/ExperimentSearchResultRunning'
          COMPLETED: '#/components/schemas/ExperimentSearchResultCompleted'
          FAILED: '#/components/schemas/ExperimentSearchResultFailed'
      oneOf:
        - {$ref: '#/components/schemas/ExperimentSearchResultNotApplicable'}
        - {$ref: '#/components/schemas/ExperimentSearchResultPending'}
        - {$ref: '#/components/schemas/ExperimentSearchResultRunning'}
        - {$ref: '#/components/schemas/ExperimentSearchResultCompleted'}
        - {$ref: '#/components/schemas/ExperimentSearchResultFailed'}
    ExperimentDetail:
      type: object
      additionalProperties: false
      description: Canonical P05 detail including the typed Search projection. Non-search experiments return search_space=[], search_configuration=null, and search_result.state=NOT_APPLICABLE.
      required: [experiment_id, research_id, parent_experiment_id, source_experiment_id, research_revision_no, objective, hypothesis, experiment_type, status, validity_state, data_snapshot_id, factor_ref, strategy_ref, cost_model_id, parameters, parameters_sha256, search_space, search_configuration, search_result, metrics, artifacts, engine, adapter, code_version, job_id, provenance, action_capabilities, started_at, finished_at, created_at, invalidated_at, invalid_reason_code, invalid_reason_detail]
      properties:
        experiment_id: *ExperimentIdSchema
        research_id: *ResearchIdSchema
        parent_experiment_id: {oneOf: [*ExperimentIdSchema, {type: 'null'}]}
        source_experiment_id: {oneOf: [*ExperimentIdSchema, {type: 'null'}], description: Non-null only when this experiment was created by reproduce; the source remains immutable.}
        research_revision_no: {type: integer, minimum: 1}
        objective: {type: string}
        hypothesis: {type: string}
        experiment_type: {type: string}
        status: {$ref: '#/components/schemas/ExperimentStatus'}
        validity_state: {$ref: '#/components/schemas/ExperimentValidityState'}
        data_snapshot_id: *SnapshotIdSchema
        factor_ref: {oneOf: [{allOf: [{$ref: '#/components/schemas/VersionRef'}, {properties: {id: *FactorIdSchema}}]}, {type: 'null'}]}
        strategy_ref: {oneOf: [{allOf: [{$ref: '#/components/schemas/VersionRef'}, {properties: {id: *StrategyIdSchema}}]}, {type: 'null'}]}
        cost_model_id: *CostModelId
        parameters: {type: array, items: {$ref: '#/components/schemas/Parameter'}}
        parameters_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        search_space: {type: array, items: {$ref: '#/components/schemas/ExperimentSearchDimension'}}
        search_configuration: {oneOf: [{$ref: '#/components/schemas/ExperimentSearchConfiguration'}, {type: 'null'}]}
        search_result: {$ref: '#/components/schemas/ExperimentSearchResult'}
        metrics: {type: array, items: {$ref: '#/components/schemas/Metric'}}
        artifacts: {type: array, items: {$ref: '#/components/schemas/ArtifactReadModel'}}
        engine: {$ref: '#/components/schemas/NamedVersion'}
        adapter: {oneOf: [{$ref: '#/components/schemas/NamedVersion'}, {type: 'null'}]}
        code_version: {type: string}
        job_id: {oneOf: [*JobIdSchema, {type: 'null'}]}
        provenance: {oneOf: [{$ref: '#/components/schemas/Provenance'}, {type: 'null'}]}
        action_capabilities: {type: array, items: {$ref: '#/components/schemas/ActionCapability'}}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        invalidated_at: {type: [string, 'null'], format: date-time}
        invalid_reason_code: {oneOf: [{$ref: '#/components/schemas/CanonicalErrorCode'}, {type: 'null'}]}
        invalid_reason_detail: {type: [string, 'null']}
    VersionRef:
      type: object
      additionalProperties: false
      description: id is a high-entropy globally unique public semantic ID; the version resolver remains scoped to the authenticated workspace.
      required: [id, version]
      properties: {id: {oneOf: [*FactorIdSchema, *StrategyIdSchema]}, version: {type: integer, minimum: 1}}
    UniverseSpec:
      type: object
