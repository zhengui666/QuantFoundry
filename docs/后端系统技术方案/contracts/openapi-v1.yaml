        state: {enum: [PENDING, RUNNING, PASS, WARN, FAIL, LOCKED, SKIPPED]}
        purpose: {type: string}
        configuration_summary: {type: string}
        calculated_result: {type: [string, 'null']}
        interpretation: {type: [string, 'null']}
        failure_code: {oneOf: [{$ref: '#/components/schemas/CanonicalErrorCode'}, {type: 'null'}]}
        failure_detail: {type: [string, 'null']}
        warning_codes: {type: array, items: {type: string}}
        artifact_ids: {type: array, items: *ArtifactId}
        provenance: {oneOf: [{$ref: '#/components/schemas/ProvenanceRef'}, {type: 'null'}]}
        override_permitted: {const: false}
    ValidationDetail:
