        leverage_limit: {type: string}
        position_limit: {type: string}
    StrategyCreateRequest:
      type: object
      additionalProperties: false
      required: [research_id, name, thesis, universe, signals, rules, cost_model_id, benchmark, research_period, validation_period, holdout_period, known_failure_modes]
      properties:
        research_id: *ResearchIdSchema
