        exposure_count: {type: integer, minimum: 0}
        period: {$ref: '#/components/schemas/DateRange'}
        approval: {oneOf: [{$ref: '#/components/schemas/ApprovalSummary'}, {type: 'null'}]}
        action_capabilities: {type: array, items: {$ref: '#/components/schemas/ActionCapability'}}
        revision: {type: integer, minimum: 1}
