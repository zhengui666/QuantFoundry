        queued_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        last_updated_at: {type: string, format: date-time}
        revision: {type: integer, minimum: 1}
    EventType:
      type: string
      description: Exact lowercase P0 R2 SSE event-type allowlist. New members require a canonical contract revision before publication.
      enum:
        - job.updated
        - research.created
        - research.updated
        - research.conclusion.created
        - experiment.created
        - experiment.updated
        - factor.updated
        - strategy.created
        - strategy.updated
        - validation.created
        - validation.updated
        - validation.holdout.updated
        - approval.created
        - approval.updated
        - paper.created
        - paper.updated
        - paper.run.updated
        - review.created
        - review.updated
        - data.provider.updated
        - data.capability.updated
        - data.quality.updated
        - agent.run.updated
        - tool.call.updated
        - memo.created
        - memo.updated
        - setup.completed
        - notification.created
        - notification.updated
        - system.health.updated
        - system.resync_required
    EventWaitingOn:
      type: object
      additionalProperties: false
      required: [type, job_id]
      properties:
        type: {const: JOB}
        job_id: *JobIdSchema
    EventPayload:
      type: object
      additionalProperties: false
      description: Named notification fields documented for P0 R2 only; full object truth remains the detail endpoint. Holdout result values, metrics, chart points, credentials, raw tool/model payloads, and internal scheduler evidence (including trading_date, attempt, lease, calendar/timezone, evidence Artifact, or failure-review detail) are forbidden. Scheduler evidence is the backend-only paper_scheduler_evidence.v1 Audit-linked Artifact.
      allOf: *EventObjectPairRules
      dependentRequired: {object_type: [object_id, object_version, object_revision], object_id: [object_type, object_version, object_revision], object_version: [object_type, object_id, object_revision], object_revision: [object_type, object_id, object_version]}
      properties:
        status: {type: [string, 'null']}
        state: {type: [string, 'null']}
        reason_code: {oneOf: [{$ref: '#/components/schemas/CanonicalErrorCode'}, {type: 'null'}]}
        resync_from_sequence: {type: [integer, 'null'], minimum: 1}
        progress_mode: {type: [string, 'null'], enum: [NONE, UNITS, null]}
        completed_units: {type: [integer, 'null'], format: int64, minimum: 0}
        total_units: {type: [integer, 'null'], format: int64, minimum: 1}
        current_step_key: {type: [string, 'null']}
        agent_run_id: {oneOf: [*AgentRunIdSchema, {type: 'null'}]}
        role: {oneOf: [{$ref: '#/components/schemas/AgentRoleKey'}, {type: 'null'}]}
        objective: {type: [string, 'null']}
        research_id: {oneOf: [*ResearchIdSchema, {type: 'null'}]}
        object_type: {oneOf: [*EventObjectType, {type: 'null'}]}
        object_id: {anyOf: [*EventObjectId, {type: 'null'}]}
        object_version: {type: [integer, 'null'], minimum: 1}
        object_revision: {type: [integer, 'null'], format: int64, minimum: 1}
        waiting_on: {oneOf: [{$ref: '#/components/schemas/EventWaitingOn'}, {type: 'null'}]}
    SseEnvelope:
      type: object
      additionalProperties: false
      description: event_id and referenced public IDs are globally unique, while sequence and replay ordering are local to the authenticated workspace stream; no envelope authorizes cross-workspace resolution.
      allOf: *EventObjectPairRules
      required: [schema_version, event_id, sequence, event_type, occurred_at, object_type, object_id, object_version, object_revision, request_id, job_id, agent_run_id, tool_call_id, payload]
      properties:
        schema_version: {type: integer, const: 1}
        event_id: *DomainEventId
        sequence: {type: integer, format: int64, minimum: 1}
        event_type: {$ref: '#/components/schemas/EventType'}
        occurred_at: {type: string, format: date-time}
        object_type: *EventObjectType
        object_id: *EventObjectId
        object_version: {type: [integer, 'null'], minimum: 1}
        object_revision: {type: [integer, 'null'], format: int64, minimum: 1}
        request_id: {type: [string, 'null']}
        job_id: {oneOf: [*JobIdSchema, {type: 'null'}]}
        agent_run_id: {oneOf: [*AgentRunIdSchema, {type: 'null'}]}
        tool_call_id: {oneOf: [*ToolCallIdSchema, {type: 'null'}]}
