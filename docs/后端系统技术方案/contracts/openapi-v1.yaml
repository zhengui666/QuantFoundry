      type: object
      additionalProperties: false
      description: id is globally unique but remains workspace-authorized; hash equality never grants object access.
      required: [id, version, sha256]
      properties: {id: {oneOf: [*StrategyIdSchema, *FactorIdSchema, *CostModelId]}, version: {type: integer, minimum: 1}, sha256: {type: string, pattern: '^[0-9a-f]{64}$'}}
