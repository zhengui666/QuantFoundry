        base_currency: {type: string, pattern: '^[A-Z]{3}$'}
        number_format_locale: {type: string}
        ai_connection_id: {type: string, minLength: 1, description: Required in P0_EXECUTABLE_R2; expired refs fail with CONNECTION_VALIDATION_EXPIRED and non-AI refs fail with CONNECTION_KIND_MISMATCH.}
        default_data_provider_id: {type: [string, 'null']}
