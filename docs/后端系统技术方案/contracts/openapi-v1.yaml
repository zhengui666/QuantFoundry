    SetupStatus:
      type: object
      additionalProperties: false
      description: Canonical P00 reload truth. Reference readiness booleans and nullable references are machine-coupled; clients must never reconstruct references from names, defaults, or browser storage.
      required: [completed, owner_session_ready, ai_provider_configured, ai_connection_id, data_provider_configured, research_policy_active, research_policy_id, risk_policy_active, risk_policy_id, cost_model_active, cost_model_id, fallback_step]
      properties:
        completed: {type: boolean}
        owner_session_ready: {type: boolean}
        ai_provider_configured: {type: boolean}
        ai_connection_id:
          type: [string, 'null']
          description: Opaque reference only when the selected AI connection is validated, active, unexpired, owner-bound, and kind AI. Invalid, expired, missing, or wrong-kind references are returned as null; credentials and provider secrets are never returned.
        data_provider_configured: {type: boolean}
        research_policy_active: {type: boolean}
        research_policy_id:
          oneOf: [*ResearchPolicyId, {type: 'null'}]
          description: Stable public research-policy reference only when status is ACTIVE, the version is bound to the current Owner/workspace, and kind is RESEARCH_POLICY; DRAFT, RETIRED, missing, wrong-kind, or cross-scope references are null.
        risk_policy_active: {type: boolean}
        risk_policy_id:
          oneOf: [*RiskPolicyId, {type: 'null'}]
          description: Stable public risk-policy reference only when status is ACTIVE, the version is bound to the current Owner/workspace, and kind is RISK_POLICY; DRAFT, RETIRED, missing, wrong-kind, or cross-scope references are null.
        cost_model_active: {type: boolean}
        cost_model_id:
          oneOf: [*CostModelId, {type: 'null'}]
          description: Stable public cost-model reference only when status is ACTIVE, the version is bound to the current Owner/workspace, and kind is COST_MODEL; DRAFT, RETIRED, missing, wrong-kind, or cross-scope references are null.
        fallback_step:
          type: [string, 'null']
          enum: [AI_PROVIDER, RESEARCH_DEFAULTS, RESEARCH_CONSTITUTION, null]
          description: Earliest required recovery step caused by an invalid server reference. Null means no AI/policy/cost reference recovery is required; it does not by itself mean setup is completed.
      allOf:
        - if:
            required: [ai_provider_configured]
            properties: {ai_provider_configured: {const: true}}
          then:
            properties: {ai_connection_id: {type: string, minLength: 1}}
          else:
            properties: {ai_connection_id: {type: 'null'}}
        - if:
            required: [research_policy_active]
            properties: {research_policy_active: {const: true}}
          then:
            properties: {research_policy_id: *ResearchPolicyId}
          else:
            properties: {research_policy_id: {type: 'null'}}
        - if:
            required: [risk_policy_active]
            properties: {risk_policy_active: {const: true}}
          then:
            properties: {risk_policy_id: *RiskPolicyId}
          else:
            properties: {risk_policy_id: {type: 'null'}}
        - if:
            required: [cost_model_active]
            properties: {cost_model_active: {const: true}}
          then:
            properties: {cost_model_id: *CostModelId}
          else:
            properties: {cost_model_id: {type: 'null'}}
        - if:
            required: [ai_provider_configured]
            properties: {ai_provider_configured: {const: false}}
          then:
            properties: {fallback_step: {const: AI_PROVIDER}}
          else:
            if:
              required: [cost_model_active]
              properties: {cost_model_active: {const: false}}
            then:
              properties: {fallback_step: {const: RESEARCH_DEFAULTS}}
            else:
              if:
                anyOf:
                  - required: [research_policy_active]
                    properties: {research_policy_active: {const: false}}
                  - required: [risk_policy_active]
                    properties: {risk_policy_active: {const: false}}
              then:
                properties: {fallback_step: {const: RESEARCH_CONSTITUTION}}
              else:
                properties: {fallback_step: {type: 'null'}}
        - if:
            required: [completed]
            properties: {completed: {const: true}}
          then:
            properties:
              owner_session_ready: {const: true}
              ai_provider_configured: {const: true}
              ai_connection_id: {type: string, minLength: 1}
              research_policy_active: {const: true}
              research_policy_id: *ResearchPolicyId
              risk_policy_active: {const: true}
              risk_policy_id: *RiskPolicyId
              cost_model_active: {const: true}
              cost_model_id: *CostModelId
              fallback_step: {type: 'null'}
