components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-owner-session
  parameters:
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 20, maxLength: 128}}
    IfMatch: {in: header, name: If-Match, required: true, schema: {type: string, minLength: 1}}
    ResearchId: {in: path, name: research_id, required: true, schema: *ResearchIdSchema}
    DatasetId:
      in: path
      name: dataset_id
      required: true
      description: High-entropy Dataset public ID; exact R2 grammar is DSSET- plus canonical uppercase Crockford ULID or canonical lowercase UUIDv4. Global uniqueness never grants cross-workspace access.
      schema: *DatasetIdSchema
    SnapshotId: {in: path, name: snapshot_id, required: true, schema: *SnapshotIdSchema}
    ExperimentId: {in: path, name: experiment_id, required: true, schema: *ExperimentIdSchema}
    FactorId: {in: path, name: factor_id, required: true, schema: *FactorIdSchema}
    StrategyId: {in: path, name: strategy_id, required: true, schema: *StrategyIdSchema}
    ValidationId: {in: path, name: validation_id, required: true, schema: *ValidationIdSchema}
    ApprovalId: {in: path, name: approval_id, required: true, schema: *ApprovalIdSchema}
    MemoId: {in: path, name: memo_id, required: true, schema: *MemoIdSchema}
    JobId: {in: path, name: job_id, required: true, schema: *JobIdSchema}
    AgentRunId: {in: path, name: agent_run_id, required: true, schema: *AgentRunIdSchema}
    ToolCallId: {in: path, name: tool_call_id, required: true, schema: *ToolCallIdSchema}
    Version: {in: path, name: version, required: true, schema: {type: integer, minimum: 1}}
    AgentRole: {in: path, name: role, required: true, schema: {$ref: '#/components/schemas/AgentRoleKey'}}
  responses:
    Problem401: {description: Authentication required or invalid, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem403: {description: Authenticated actor lacks authority, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem404: {description: Resource not found, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem409: {description: 'Domain, idempotency, or lifecycle conflict', content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem412: {description: If-Match revision mismatch, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem422: {description: Field or domain validation failed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem428: {description: Required precondition header missing, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem429: {description: 'Budget, rate, or multiple-testing limit reached', headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Problem503: {description: Required service unavailable or degraded, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required: [status, database, job_queue, event_stream, artifact_store, checked_at]
      properties:
        status: {enum: [HEALTHY, DEGRADED, UNAVAILABLE]}
        database: {enum: [HEALTHY, DEGRADED, UNAVAILABLE]}
        job_queue: {enum: [HEALTHY, DEGRADED, UNAVAILABLE]}
        event_stream: {enum: [HEALTHY, DEGRADED, UNAVAILABLE]}
        artifact_store: {enum: [HEALTHY, DEGRADED, UNAVAILABLE]}
        checked_at: {type: string, format: date-time}
    CanonicalErrorCode:
      type: string
      enum: [INVALID_REQUEST, RESOURCE_NOT_FOUND, PRECONDITION_REQUIRED, REVISION_MISMATCH, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS, RESOURCE_CONFLICT, SERVICE_DEGRADED, INTERNAL_ERROR, UNAUTHENTICATED, PERMISSION_DENIED, HUMAN_APPROVAL_REQUIRED, RESEARCH_NOT_MUTABLE, RESEARCH_WAITING_USER, EXPERIMENT_IMMUTABLE, EXPERIMENT_INVALID, NON_REPRODUCIBLE, MULTIPLE_TESTING_LIMIT_REACHED, STRATEGY_VERSION_FROZEN, STRATEGY_VERSION_MISMATCH, STRATEGY_NOT_FROZEN, STRATEGY_NOT_VALIDATED, VALIDATION_IN_PROGRESS, VALIDATION_FAILED, VALIDATION_PREREQUISITES_INCOMPLETE, VALIDATION_TEST_BLOCKED, HOLDOUT_LOCKED, HOLDOUT_APPROVAL_REQUIRED, HOLDOUT_PREREQUISITES_INCOMPLETE, HOLDOUT_ALREADY_EXPOSED, HOLDOUT_RESULT_FORBIDDEN, APPROVAL_STALE, APPROVAL_ALREADY_RESOLVED, APPROVAL_PREREQUISITES_CHANGED, APPROVAL_TYPE_MISMATCH, DATA_CAPABILITY_MISSING, DATA_QUALITY_BLOCKED, DATA_SNAPSHOT_MISSING, PIT_GUARANTEE_UNAVAILABLE, STALE_DATA, PROVIDER_UNAVAILABLE, JOB_CONFLICT, JOB_NOT_CANCELLABLE, JOB_LEASE_LOST, JOB_FAILED, PAPER_APPROVAL_REQUIRED, PAPER_RISK_BLOCKED, PAPER_DATA_BLOCKED, PAPER_DUPLICATE_RUN, PAPER_VERSION_MISMATCH, RISK_LIMIT_EXCEEDED, AGENT_DISABLED, AGENT_TOOL_FORBIDDEN, AGENT_BUDGET_EXCEEDED, AGENT_OUTPUT_INVALID, AGENT_MODEL_UNAVAILABLE, AGENT_RESUME_CONFLICT, AGENT_CONTEXT_STALE, AGENT_RETRY_EXHAUSTED, TOOL_INPUT_INVALID, TOOL_EXECUTION_FAILED, CREDENTIAL_INVALID, CREDENTIAL_NOT_CONFIGURED, CONNECTION_VALIDATION_EXPIRED, CONNECTION_KIND_MISMATCH]
    ApiProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, instance, request_id, retryable, field_errors, context]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {$ref: '#/components/schemas/CanonicalErrorCode'}
        detail: {type: [string, 'null']}
        instance: {type: [string, 'null']}
        request_id: {type: string}
        retryable: {type: boolean}
        field_errors: {type: array, items: {$ref: '#/components/schemas/FieldError'}}
        context: {$ref: '#/components/schemas/ProblemContext'}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties: {field: {type: string}, code: {type: string}, message: {type: string}}
    ProblemContext:
      type: object
      additionalProperties: false
      description: Stable optional diagnostic keys; object locator is a closed type/id/version/revision tuple and secrets or raw provider payloads are forbidden.
      allOf: *EventObjectPairRules
      dependentRequired: {object_type: [object_id, object_version, object_revision], object_id: [object_type, object_version, object_revision], object_version: [object_type, object_id, object_revision], object_revision: [object_type, object_id, object_version]}
      properties:
        object_type: {oneOf: [*EventObjectType, {type: 'null'}]}
        object_id: {anyOf: [*EventObjectId, {type: 'null'}]}
        object_version: {type: [integer, 'null'], minimum: 1}
        object_revision: {type: [integer, 'null'], format: int64, minimum: 1}
        expected_revision: {type: [integer, 'null'], minimum: 1}
        actual_revision: {type: [integer, 'null'], minimum: 1}
        approval_id: {oneOf: [*ApprovalIdSchema, {type: 'null'}]}
        validation_id: {oneOf: [*ValidationIdSchema, {type: 'null'}]}
        retry_after_seconds: {type: [integer, 'null'], minimum: 1}
    ActionCapability:
      type: object
      additionalProperties: false
      required: [action, visibility, allowed, reason_code, reason_detail, requires_confirmation, idempotency_required, if_match_required, result_mode, danger_level]
      properties:
        action: {type: string}
        visibility: {enum: [SHOW, HIDE]}
        allowed: {type: boolean}
        reason_code: {oneOf: [{$ref: '#/components/schemas/CanonicalErrorCode'}, {type: 'null'}]}
        reason_detail: {type: [string, 'null']}
        requires_confirmation: {type: boolean}
        idempotency_required: {type: boolean}
        if_match_required: {type: boolean}
        result_mode: {enum: [IMMEDIATE, JOB]}
        danger_level: {enum: [NORMAL, STATE_CHANGE, IRREVERSIBLE, CAPITAL_GATE]}
    ObjectRef:
      type: object
      additionalProperties: false
      description: Public-resource reference only. Object id is an exact high-entropy globally unique public semantic ID; type selects the only legal prefix schema. Event/audit special locators (strategy_version, settings, provider_connection, agent_config, event_stream) are deliberately not added to these 34 public types. The server MUST still resolve and authorize it inside the caller's authenticated workspace.
      required: [type, id, version, revision]
      properties:
        type: {enum: [research_policy, risk_policy, cost_model, credential, capability, dataset, snapshot, data_quality_run, data_quality_issue, research, evidence, conclusion, experiment, factor, strategy, validation, exposure, red_team_run, portfolio, memo, approval, paper, paper_run, paper_order, paper_fill, review, agent_run, tool_call, job, domain_event, audit_event, artifact, notification, provenance]}
        id: *AnyPublicSemanticId
        version: {type: [integer, 'null'], minimum: 1}
        revision: {type: integer, minimum: 1}
      allOf:
        - if: {properties: {type: {const: research_policy}}, required: [type]}
          then: {properties: {id: *ResearchPolicyId}}
        - if: {properties: {type: {const: risk_policy}}, required: [type]}
          then: {properties: {id: *RiskPolicyId}}
        - if: {properties: {type: {const: cost_model}}, required: [type]}
          then: {properties: {id: *CostModelId}}
        - if: {properties: {type: {const: credential}}, required: [type]}
          then: {properties: {id: *CredentialId}}
        - if: {properties: {type: {const: capability}}, required: [type]}
          then: {properties: {id: *CapabilityId}}
        - if:
            required: [type]
            properties: {type: {const: dataset}}
          then:
            properties: {id: *DatasetIdSchema}
        - if: {properties: {type: {const: snapshot}}, required: [type]}
          then: {properties: {id: *SnapshotIdSchema}}
        - if: {properties: {type: {const: data_quality_run}}, required: [type]}
          then: {properties: {id: *DataQualityRunId}}
        - if: {properties: {type: {const: data_quality_issue}}, required: [type]}
          then: {properties: {id: *DataQualityIssueId}}
        - if: {properties: {type: {const: research}}, required: [type]}
          then: {properties: {id: *ResearchIdSchema}}
        - if: {properties: {type: {const: evidence}}, required: [type]}
          then: {properties: {id: *EvidenceId}}
        - if: {properties: {type: {const: conclusion}}, required: [type]}
