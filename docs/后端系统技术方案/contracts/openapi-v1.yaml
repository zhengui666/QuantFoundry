        category: {type: string}
        current_version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, RESEARCHING, PROMISING, VALIDATED, REJECTED, ARCHIVED]}
        description: {type: string}
        economic_rationale: {type: string}
        formula: {$ref: '#/components/schemas/FactorFormula'}
        universe: {$ref: '#/components/schemas/UniverseSpec'}
        frequency: {const: DAILY}
        definition_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        revision: {type: integer, minimum: 1}
        action_capabilities: {type: array, items: {$ref: '#/components/schemas/ActionCapability'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FactorAnalysisRequest:
      type: object
