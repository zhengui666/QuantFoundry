      properties:
        thesis: {type: string}
        universe: {$ref: '#/components/schemas/UniverseSpec'}
        signals: {type: array, items: {$ref: '#/components/schemas/StrategySignal'}}
        rules: {$ref: '#/components/schemas/StrategyRules'}
        cost_model_id: *CostModelId
        benchmark: {type: string}
        research_period: {$ref: '#/components/schemas/DateRange'}
        validation_period: {$ref: '#/components/schemas/DateRange'}
        holdout_period: {$ref: '#/components/schemas/DateRange'}
        known_failure_modes: {type: array, items: {type: string}}
        spec_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    StrategyBacktestResultSummary:
      type: object
