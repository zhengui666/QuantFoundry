        thesis: {type: string}
        universe: {$ref: '#/components/schemas/UniverseSpec'}
        signals: {type: array, items: {$ref: '#/components/schemas/StrategySignal'}}
        rules: {$ref: '#/components/schemas/StrategyRules'}
        cost_model_id: *CostModelId
        benchmark: {type: string}
        research_period: {$ref: '#/components/schemas/DateRange'}
        validation_period: {$ref: '#/components/schemas/DateRange'}
        holdout_period: {$ref: '#/components/schemas/DateRange'}
        known_failure_modes: {type: array, items: {type: string}}
        spec_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        specification: {$ref: '#/components/schemas/StrategySpecification'}
        latest_backtest: {$ref: '#/components/schemas/StrategyLatestBacktest'}
        validation_summary: {oneOf: [{$ref: '#/components/schemas/StrategyValidationSummary'}, {type: 'null'}]}
        artifacts: {type: array, items: {$ref: '#/components/schemas/ArtifactReadModel'}}
        provenance: {type: array, items: {$ref: '#/components/schemas/ProvenanceRef'}}
        frozen_at: {type: [string, 'null'], format: date-time}
        frozen_by: {type: [string, 'null']}
        revision: {type: integer, minimum: 1}
        action_capabilities: {type: array, items: {$ref: '#/components/schemas/ActionCapability'}}
        created_at: {type: string, format: date-time}
