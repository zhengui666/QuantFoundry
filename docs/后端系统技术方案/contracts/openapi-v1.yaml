      properties: {acknowledged_subject_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}}
    ApprovalRejectRequest:
      type: object
      additionalProperties: false
      required: [reason, acknowledged_subject_sha256]
      properties: {reason: {type: string, minLength: 1, maxLength: 4000}, acknowledged_subject_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}}
    ApprovalDecisionResult:
      type: object
      additionalProperties: false
      required: [approval, subject_ref, next_job]
      properties:
        approval: {$ref: '#/components/schemas/ApprovalDetail'}
        subject_ref: {$ref: '#/components/schemas/ObjectRef'}
        next_job: {oneOf: [{$ref: '#/components/schemas/JobAccepted'}, {type: 'null'}]}
    JobProgress:
      type: object
      additionalProperties: false
      required: [mode, completed_units, total_units, unit, percent, current_step_key, current_step_label]
      properties:
        mode: {enum: [NONE, UNITS]}
        completed_units: {type: [integer, 'null'], format: int64, minimum: 0}
        total_units: {type: [integer, 'null'], format: int64, minimum: 1}
        unit: {type: [string, 'null']}
        percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        current_step_key: {type: [string, 'null']}
        current_step_label: {type: [string, 'null']}
    JobResultRef:
      type: object
      additionalProperties: false
      description: Closed result locator. A null object locator is represented only by four null object fields; artifact_id remains independently nullable.
      allOf: *EventObjectPairRules
      required: [object_type, object_id, object_version, object_revision, artifact_id]
      properties:
        object_type: {oneOf: [*EventObjectType, {type: 'null'}]}
        object_id: {anyOf: [*EventObjectId, {type: 'null'}]}
        object_version: {type: [integer, 'null'], minimum: 1}
        object_revision: {type: [integer, 'null'], format: int64, minimum: 1}
        artifact_id: {oneOf: [*ArtifactId, {type: 'null'}]}
    JobAccepted:
      type: object
      additionalProperties: false
      required: [job_id, status, progress, resource_ref, created_at]
      properties:
        job_id: *JobIdSchema
        status: {enum: [QUEUED, RUNNING]}
        progress: {$ref: '#/components/schemas/JobProgress'}
        resource_ref: {oneOf: [{$ref: '#/components/schemas/ObjectRef'}, {type: 'null'}]}
        created_at: {type: string, format: date-time}
    JobDetail:
      type: object
      additionalProperties: false
      required: [job_id, job_type, status, progress, error_code, result_ref, queued_at, started_at, finished_at, last_updated_at, revision]
      properties:
        job_id: *JobIdSchema
        job_type: {type: string}
        status: {enum: [QUEUED, RUNNING, WAITING_USER, COMPLETED, FAILED, CANCELLED]}
        progress: {$ref: '#/components/schemas/JobProgress'}
        error_code: {oneOf: [{$ref: '#/components/schemas/CanonicalErrorCode'}, {type: 'null'}]}
