      additionalProperties: false
      required: [section_key, title, content, evidence_links]
      properties:
        section_key: {type: string}
        title: {type: string}
        content: {type: string}
        evidence_links: {type: array, items: {$ref: '#/components/schemas/MemoEvidenceLink'}}
    MemoDetail:
      type: object
      additionalProperties: false
      required: [memo_id, strategy, status, sections, provenance, revision, action_capabilities, created_at, updated_at]
