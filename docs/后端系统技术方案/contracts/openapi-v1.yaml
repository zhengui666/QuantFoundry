  x-quantfoundry-event-object-type: &EventObjectType
    type: string
    description: Closed P0 R2 event/audit object-locator branch. The value selects the only legal object_id grammar; it is never an authorization token.
    enum: [job, research, conclusion, experiment, factor, strategy_version, validation, approval, paper, paper_run, review, capability, snapshot, agent_run, tool_call, memo, notification, settings, provider_connection, agent_config, event_stream]
  x-quantfoundry-event-object-id: &EventObjectId
    anyOf:
      - *JobIdSchema
      - *ResearchIdSchema
      - *ConclusionId
      - *ExperimentIdSchema
      - *FactorIdSchema
      - *StrategyIdSchema
      - *ValidationIdSchema
      - *ApprovalIdSchema
      - *PaperId
      - *PaperRunId
      - *ReviewId
      - *CapabilityId
      - *SnapshotIdSchema
      - *AgentRunIdSchema
      - *ToolCallIdSchema
      - *MemoIdSchema
      - *NotificationId
      - {type: string, const: SETTINGS-DEFAULT}
      - {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      - {type: string, enum: [RESEARCH_DIRECTOR, FACTOR_SCIENTIST, STRATEGY_SCIENTIST, PORTFOLIO_ANALYST, RED_TEAM_RESEARCHER, PERFORMANCE_ANALYST]}
      - *DomainEventId
  x-quantfoundry-event-object-pair-rules: &EventObjectPairRules
    - {if: {properties: {object_type: {const: job}}, required: [object_type]}, then: {properties: {object_id: *JobIdSchema}}}
    - {if: {properties: {object_type: {const: research}}, required: [object_type]}, then: {properties: {object_id: *ResearchIdSchema}}}
    - {if: {properties: {object_type: {const: conclusion}}, required: [object_type]}, then: {properties: {object_id: *ConclusionId}}}
    - {if: {properties: {object_type: {const: experiment}}, required: [object_type]}, then: {properties: {object_id: *ExperimentIdSchema}}}
    - {if: {properties: {object_type: {const: factor}}, required: [object_type]}, then: {properties: {object_id: *FactorIdSchema}}}
    - {if: {properties: {object_type: {const: strategy_version}}, required: [object_type]}, then: {properties: {object_id: *StrategyIdSchema, object_version: {type: integer, minimum: 1}, object_revision: {type: integer, format: int64, minimum: 1}}, required: [object_version, object_revision]}}
    - {if: {properties: {object_type: {const: validation}}, required: [object_type]}, then: {properties: {object_id: *ValidationIdSchema}}}
    - {if: {properties: {object_type: {const: approval}}, required: [object_type]}, then: {properties: {object_id: *ApprovalIdSchema}}}
    - {if: {properties: {object_type: {const: paper}}, required: [object_type]}, then: {properties: {object_id: *PaperId}}}
    - {if: {properties: {object_type: {const: paper_run}}, required: [object_type]}, then: {properties: {object_id: *PaperRunId}}}
    - {if: {properties: {object_type: {const: review}}, required: [object_type]}, then: {properties: {object_id: *ReviewId}}}
    - {if: {properties: {object_type: {const: capability}}, required: [object_type]}, then: {properties: {object_id: *CapabilityId}}}
    - {if: {properties: {object_type: {const: snapshot}}, required: [object_type]}, then: {properties: {object_id: *SnapshotIdSchema}}}
    - {if: {properties: {object_type: {const: agent_run}}, required: [object_type]}, then: {properties: {object_id: *AgentRunIdSchema}}}
    - {if: {properties: {object_type: {const: tool_call}}, required: [object_type]}, then: {properties: {object_id: *ToolCallIdSchema}}}
    - {if: {properties: {object_type: {const: memo}}, required: [object_type]}, then: {properties: {object_id: *MemoIdSchema}}}
    - {if: {properties: {object_type: {const: notification}}, required: [object_type]}, then: {properties: {object_id: *NotificationId}}}
    - {if: {properties: {object_type: {const: settings}}, required: [object_type]}, then: {properties: {object_id: {type: string, const: SETTINGS-DEFAULT}, object_version: {type: 'null'}, object_revision: {type: integer, format: int64, minimum: 1}}, required: [object_revision]}}
    - {if: {properties: {object_type: {const: provider_connection}}, required: [object_type]}, then: {properties: {object_id: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}, object_version: {type: 'null'}, object_revision: {type: integer, format: int64, minimum: 1}}, required: [object_revision]}}
    - {if: {properties: {object_type: {const: agent_config}}, required: [object_type]}, then: {properties: {object_id: {type: string, enum: [RESEARCH_DIRECTOR, FACTOR_SCIENTIST, STRATEGY_SCIENTIST, PORTFOLIO_ANALYST, RED_TEAM_RESEARCHER, PERFORMANCE_ANALYST]}, object_version: {type: 'null'}, object_revision: {type: integer, format: int64, minimum: 1}}, required: [object_revision]}}
    - {if: {properties: {object_type: {const: event_stream}}, required: [object_type]}, then: {properties: {object_id: *DomainEventId, object_version: {type: 'null'}, object_revision: {type: integer, format: int64, minimum: 1}}, required: [object_revision]}}
    - {if: {properties: {object_type: {type: 'null'}}, required: [object_type]}, then: {properties: {object_id: {type: 'null'}, object_version: {type: 'null'}, object_revision: {type: 'null'}}}}
    - {if: {properties: {object_id: {type: 'null'}}, required: [object_id]}, then: {properties: {object_type: {type: 'null'}, object_version: {type: 'null'}, object_revision: {type: 'null'}}}}
    - {if: {properties: {event_type: {const: job.updated}}, required: [event_type]}, then: {properties: {object_type: {const: job}}}}
    - {if: {properties: {event_type: {enum: [research.created, research.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: research}}}}
    - {if: {properties: {event_type: {const: research.conclusion.created}}, required: [event_type]}, then: {properties: {object_type: {const: conclusion}}}}
    - {if: {properties: {event_type: {enum: [experiment.created, experiment.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: experiment}}}}
    - {if: {properties: {event_type: {const: factor.updated}}, required: [event_type]}, then: {properties: {object_type: {const: factor}}}}
    - {if: {properties: {event_type: {enum: [strategy.created, strategy.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: strategy_version}}}}
    - {if: {properties: {event_type: {enum: [validation.created, validation.updated, validation.holdout.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: validation}}}}
    - {if: {properties: {event_type: {enum: [approval.created, approval.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: approval}}}}
    - {if: {properties: {event_type: {enum: [paper.created, paper.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: paper}}}}
    - {if: {properties: {event_type: {const: paper.run.updated}}, required: [event_type]}, then: {properties: {object_type: {const: paper_run}}}}
    - {if: {properties: {event_type: {enum: [review.created, review.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: review}}}}
    - {if: {properties: {event_type: {const: data.provider.updated}}, required: [event_type]}, then: {properties: {object_type: {const: provider_connection}}}}
    - {if: {properties: {event_type: {const: data.capability.updated}}, required: [event_type]}, then: {properties: {object_type: {const: capability}}}}
    - {if: {properties: {event_type: {const: data.quality.updated}}, required: [event_type]}, then: {properties: {object_type: {const: snapshot}}}}
    - {if: {properties: {event_type: {const: agent.run.updated}}, required: [event_type]}, then: {properties: {object_type: {const: agent_run}}}}
    - {if: {properties: {event_type: {const: tool.call.updated}}, required: [event_type]}, then: {properties: {object_type: {const: tool_call}}}}
    - {if: {properties: {event_type: {enum: [memo.created, memo.updated]}}, required: [event_type]}, then: {properties: {object_type: {const: memo}}}}
    - {if: {properties: {event_type: {const: setup.completed}}, required: [event_type]}, then: {properties: {object_type: {const: settings}}}}
    - {if: {properties: {event_type: {const: notification.created}}, required: [event_type]}, then: {properties: {object_type: {const: notification}}}}
    - {if: {properties: {event_type: {const: notification.updated}}, required: [event_type]}, then: {properties: {object_type: {const: agent_config}}}}
    - {if: {properties: {event_type: {enum: [system.health.updated, system.resync_required]}}, required: [event_type]}, then: {properties: {object_type: {const: event_stream}}}}
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /system/health:
    get:
      summary: Read public component health
      operationId: getSystemHealth
      security: []
      responses:
        '200':
          description: Public component health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemHealth'}
        '503': {$ref: '#/components/responses/Problem503'}
        '422': {$ref: '#/components/responses/Problem422'}
  /setup/status:
    get:
      summary: Read authenticated setup status
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatus'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '429': {$ref: '#/components/responses/Problem429'}
  /setup/complete:
    post:
      summary: Complete required owner setup with the R2 required AI connection reference
      operationId: completeSetup
      x-quantfoundry-error-codes: [INVALID_REQUEST, CONNECTION_VALIDATION_EXPIRED, CONNECTION_KIND_MISMATCH, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupCompleteRequest'}
      responses:
        '200':
          description: Persisted settings
          headers:
            ETag:
              required: true
              description: 'Exact weak ETag of the persisted SettingsDetail representation. It MUST equal W/"{settings_id}:{revision}" for the response body and must not be derived from request input or client state.'
              schema: {type: string, pattern: '^W/"[^"]+:[1-9][0-9]*"$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingsDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /setup/capabilities:
    get:
      summary: Read server-supported setup provider and model capabilities
      operationId: getSetupCapabilities
      responses:
        '200':
          description: Redacted setup capability catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupCapabilityCatalog'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '429': {$ref: '#/components/responses/Problem429'}
  /setup/provider-connections/validate:
    post:
      summary: Validate write-only AI or data provider connection for setup
      operationId: validateSetupProviderConnection
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupProviderConnectionValidationRequest'}
      responses:
        '200':
          description: Connection and capability validation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupProviderConnectionValidationResult'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /overview:
    get:
      summary: Read the owner overview projection and P0 paper performance chart
      operationId: getOverview
      responses:
        '200':
          description: Server-authoritative overview projection
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewReadModel'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '429': {$ref: '#/components/responses/Problem429'}
        '503': {$ref: '#/components/responses/Problem503'}
  /data/capabilities:
    get:
      summary: List verified provider data capabilities
      operationId: listDataCapabilities
      responses:
        '200':
          description: Data capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataCapabilityList'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '429': {$ref: '#/components/responses/Problem429'}
  /data/capabilities/evaluate:
    post:
      summary: Evaluate research data requirements
      operationId: evaluateDataCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityEvaluationRequest'}
      responses:
        '200':
          description: Capability evaluation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityEvaluationResponse'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /data/datasets/{dataset_id}/validate:
    post:
      summary: Start deterministic dataset validation
      operationId: validateDataset
      parameters:
        - {$ref: '#/components/parameters/DatasetId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetValidationRequest'}
      responses:
        '202':
          description: Dataset validation job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /data/datasets/{dataset_id}/snapshots:
    post:
      summary: Create immutable dataset snapshot
      operationId: createDatasetSnapshot
      parameters:
        - {$ref: '#/components/parameters/DatasetId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SnapshotCreateRequest'}
      responses:
        '202':
          description: Snapshot creation job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /data/snapshots/{snapshot_id}:
    get:
      summary: Read immutable dataset snapshot metadata
      operationId: getDatasetSnapshot
      parameters:
        - {$ref: '#/components/parameters/SnapshotId'}
      responses:
        '200':
          description: Dataset snapshot
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetSnapshot'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '429': {$ref: '#/components/responses/Problem429'}
  /research:
    get:
      summary: List research cases
      operationId: listResearch
      responses:
        '200':
          description: Paged research cases
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchPage'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '429': {$ref: '#/components/responses/Problem429'}
    post:
      summary: Create research case
      operationId: createResearch
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResearchCreateRequest'}
      responses:
        '201':
          description: Research case
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /research/{research_id}:
    get:
      summary: Read research case detail
      operationId: getResearch
      parameters:
        - {$ref: '#/components/parameters/ResearchId'}
      responses:
        '200':
          description: Research case
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '429': {$ref: '#/components/responses/Problem429'}
  /research/{research_id}/start:
    post:
      summary: Start research program
      operationId: startResearch
      parameters:
        - {$ref: '#/components/parameters/ResearchId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResearchStartRequest'}
      responses:
        '202':
          description: Research program job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '412': {$ref: '#/components/responses/Problem412'}
        '422': {$ref: '#/components/responses/Problem422'}
        '428': {$ref: '#/components/responses/Problem428'}
        '429': {$ref: '#/components/responses/Problem429'}
  /experiments:
    post:
      summary: Create deterministic experiment
      operationId: createExperiment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentCreateRequest'}
      responses:
        '202':
          description: Experiment execution job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /experiments/{experiment_id}:
    get:
      summary: Read immutable experiment detail
      operationId: getExperiment
      parameters:
        - {$ref: '#/components/parameters/ExperimentId'}
      responses:
        '200':
          description: Experiment detail
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '429': {$ref: '#/components/responses/Problem429'}
  /experiments/{experiment_id}/reproduce:
    post:
      summary: Create and execute a new experiment from an immutable source experiment
      operationId: reproduceExperiment
      parameters:
        - {$ref: '#/components/parameters/ExperimentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentReproduceRequest'}
      responses:
        '202':
          description: New experiment and durable execution job accepted; the source experiment is unchanged
          headers:
            Location: {required: true, description: Canonical URI of the newly created Experiment, schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperimentReproduceAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /factors:
    post:
      summary: Define versioned factor
      operationId: createFactor
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FactorCreateRequest'}
      responses:
        '201':
          description: Factor detail
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /factors/{factor_id}/analyses:
    post:
      summary: Start factor analysis
      operationId: analyzeFactor
      parameters:
        - {$ref: '#/components/parameters/FactorId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FactorAnalysisRequest'}
      responses:
        '202':
          description: Factor analysis job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /strategies:
    post:
      summary: Define candidate strategy
      operationId: createStrategy
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StrategyCreateRequest'}
      responses:
        '201':
          description: Candidate strategy version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrategyVersionDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /strategies/{strategy_id}/versions/{version}:
    get:
      summary: Read versioned strategy detail including frozen immutable versions
      operationId: getStrategyVersion
      parameters:
        - {$ref: '#/components/parameters/StrategyId'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200':
          description: Strategy version detail
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrategyVersionDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '429': {$ref: '#/components/responses/Problem429'}
  /strategies/{strategy_id}/current-version:
    get:
      summary: Resolve and read the server-selected current strategy version
      operationId: getCurrentStrategyVersion
      parameters:
        - {$ref: '#/components/parameters/StrategyId'}
      responses:
        '200':
          description: Current strategy version selected by the strategy aggregate
          headers:
            ETag: {schema: {type: string}}
            Content-Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrategyVersionDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '429': {$ref: '#/components/responses/Problem429'}
  /strategies/{strategy_id}/versions/{version}/backtests:
    post:
      summary: Start candidate fast backtest
      operationId: runFastBacktest
      parameters:
        - {$ref: '#/components/parameters/StrategyId'}
        - {$ref: '#/components/parameters/Version'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BacktestRequest'}
      responses:
        '202':
          description: Backtest job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '422': {$ref: '#/components/responses/Problem422'}
        '429': {$ref: '#/components/responses/Problem429'}
  /strategies/{strategy_id}/versions/{version}/freeze:
    post:
      summary: Freeze eligible strategy version
      operationId: freezeStrategy
      parameters:
        - {$ref: '#/components/parameters/StrategyId'}
        - {$ref: '#/components/parameters/Version'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeStrategyRequest'}
      responses:
        '200':
          description: Frozen immutable strategy version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrategyVersionDetail'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '412': {$ref: '#/components/responses/Problem412'}
        '422': {$ref: '#/components/responses/Problem422'}
        '428': {$ref: '#/components/responses/Problem428'}
        '429': {$ref: '#/components/responses/Problem429'}
  /validations:
    post:
      summary: Start strict validation for frozen strategy
      operationId: createValidation
      parameters:
