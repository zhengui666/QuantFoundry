      type: object
      additionalProperties: false
      required: [type, id, version, revision, sha256]
      properties: {type: {enum: [STRATEGY_VERSION, VALIDATION, PAPER]}, id: {oneOf: [*StrategyIdSchema, *ValidationIdSchema, *PaperId]}, version: {type: [integer, 'null'], minimum: 1}, revision: {type: integer, minimum: 1}, sha256: {type: string, pattern: '^[0-9a-f]{64}$'}}
      allOf:
        - if: {properties: {type: {const: STRATEGY_VERSION}}, required: [type]}
          then: {properties: {id: *StrategyIdSchema}}
        - if: {properties: {type: {const: VALIDATION}}, required: [type]}
          then: {properties: {id: *ValidationIdSchema}}
        - if: {properties: {type: {const: PAPER}}, required: [type]}
          then: {properties: {id: *PaperId}}
