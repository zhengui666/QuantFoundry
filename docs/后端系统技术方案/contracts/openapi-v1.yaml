      description: P0 R2 intentionally tightens the pre-release executable baseline by requiring a successful, unexpired, unconsumed, owner-bound AI connection reference of kind AI.
      required: [language, timezone, base_currency, number_format_locale, ai_connection_id, default_benchmark, default_frequency, initial_paper_capital, research_policy_id, risk_policy_id, cost_model_id]
      properties:
