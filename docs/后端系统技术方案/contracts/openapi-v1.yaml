      required: [commit, build_id]
      properties: {commit: {type: string}, build_id: {type: string}}
    PolicyRef:
      type: object
      additionalProperties: false
      description: Policy id is globally unique but MUST resolve to an active policy of the required kind in the authenticated workspace.
      required: [type, id, version]
      properties: {type: {enum: [research_policy, risk_policy]}, id: {oneOf: [*ResearchPolicyId, *RiskPolicyId]}, version: {type: integer, minimum: 1}}
