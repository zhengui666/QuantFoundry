      required: [experiment, status, validity_state, result_sha256, job_id, provenance, started_at, finished_at]
      properties:
        experiment: {$ref: '#/components/schemas/ObjectRef'}
        status: {$ref: '#/components/schemas/ExperimentStatus'}
        validity_state: {$ref: '#/components/schemas/ExperimentValidityState'}
        result_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        job_id: {oneOf: [*JobIdSchema, {type: 'null'}]}
        provenance: {$ref: '#/components/schemas/ProvenanceRef'}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: string, format: date-time}
