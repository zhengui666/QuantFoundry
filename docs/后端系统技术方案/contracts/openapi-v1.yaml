        research_policy_id: {allOf: [*ResearchPolicyId], description: 'Must resolve to status ACTIVE, current Owner/workspace, and kind RESEARCH_POLICY.'}
        risk_policy_id: {allOf: [*RiskPolicyId], description: 'Must resolve to status ACTIVE, current Owner/workspace, and kind RISK_POLICY.'}
        cost_model_id: {allOf: [*CostModelId], description: 'Must resolve to status ACTIVE, current Owner/workspace, and kind COST_MODEL.'}
    SettingsDetail:
      type: object
      additionalProperties: false
      required: [settings_id, revision, language, timezone, base_currency, number_format_locale, ai_connection_id, default_data_provider_id, default_benchmark, default_frequency, default_research_start, initial_paper_capital, research_policy_id, risk_policy_id, cost_model_id, created_at, updated_at]
      properties:
        settings_id: {type: string, const: SETTINGS-DEFAULT, description: Workspace-local singleton alias; not a public semantic object ID.}
        revision: {type: integer, minimum: 1}
        language: {enum: [zh-CN, en]}
        timezone: {type: string}
        base_currency: {type: string}
        number_format_locale: {type: string}
        ai_connection_id: {type: string}
        default_data_provider_id: {type: [string, 'null']}
        default_benchmark: {type: string}
        default_frequency: {const: DAILY}
        default_research_start: {type: [string, 'null'], format: date}
