version: 1.0.0
status_semantics:
  open: Defined but not independently verified.
  blocked: Cannot close until a stated dependency or authority is available.
  closed: All closure criteria, independent verification, and evidence are complete.
closure_evidence_contract:
  schema_version: 1.0.0
  artifact_transport: GitHub Actions artifact or GitHub Release asset ZIP containing
    the declared JSON report_path.
  report_fields:
  - schema_version
  - content_type
  - commit_sha
  - github_run_id
  - verifier_role
  - verified_at_utc
  - closure_criteria
  - commands
  - artifact
  - attestation
  role_content_types:
    Independent Test Agent: application/vnd.quantfoundry.p0-test-evidence+json;version=1
    Independent Review Agent: application/vnd.quantfoundry.p0-review-evidence+json;version=1
  attestation_requirements:
  - provider is github-actions
  - issuer is https://token.actions.githubusercontent.com
  - repository, run_id, subject_uri, and subject_sha256 bind the downloaded report
    content
  independence: Independent Test Agent and Independent Review Agent records must use
    distinct github-actions run ids.
blockers:
- id: P0-PRODUCT-PAPER-DAILY-SCHEDULER
  title: Paper daily scheduler is safe, unique, recoverable, and audited
  source:
  - docs/PRD/V1.0.0.md#521-p0-日调度可执行契约
  - docs/后端系统技术方案/QuantFoundry_Backend_System_Technical_Design_V1.0.0.md#23-paper-trading
  - docs/全栈测试方案/QuantFoundry_Full_Stack_Test_Plan_V1.0.0.md#27-paper-acceptance--qf-e2e-060full-v1-future-staged
  owner_role: Backend Agent
  closure_criteria:
  - Scheduler uses deployment execution_assumption due-time/timezone/calendar, derives
    trading_date deterministically, and fails closed on invalid configuration/calendar.
  - Workspace-scoped paper_scheduler_states is the authoritative ACTIVE/PAUSED/DISABLED
    suppression state with non-null resume watermark, suppression timestamp invariant,
    and atomic append-only Audit `summary.paper_scheduler_state_evidence.v1` + closed
    paper.updated Event for every initialization or transition; state evidence creates
    no Job/Artifact and detail_artifact_id is NULL; missing/unknown/inconsistent state
    fails closed.
  - Scheduler creates at most one PaperDailyRun per workspace, paper, and trading
    date; bounded catch-up handles only the most recent unfinished trading day strictly
    after the resume watermark. Paused/disabled intervals create no run or debt; resume
    never replays a pre-watermark due instant.
  - Failed data-quality or risk gate produces BLOCKED and no orders; unknown post-side-effect
    recovery produces FAILED and no automatic replay.
  - 'Lease, retry, crash, restart, suppression lifecycle, migration initialization,
    and duplicate-wake-up recovery preserve canonical state and atomically persist
    the correct evidence path: state detail in Audit summary only; execution-only
    `paper_scheduler_evidence.v1` Artifact metadata with non-null PAPER_DAILY_RUN
    Job binding and Audit detail_artifact_id. Empty/arbitrary Artifact cannot bypass
    either path; SSE exposes no state detail or EventPayload extension.'
  verification:
  - Independent Test Agent executes QF-PAPER-SCH-001..007 scheduler, suppression/watermark,
    duplicate, gate-failure, calendar, migration-initialization, recovery, mutually
    exclusive state-Audit/execution-Artifact evidence, and closed-SSE negative acceptance
    coverage on real PostgreSQL.
  - Independent Review Agent verifies declarative-model/Alembic authority, derived
    manifest/snapshot regeneration, documented state-Audit schema, execution Audit-to-Job-bound-Artifact
    links, and no-EventPayload-extension boundary against the canonical contracts.
  status: closed
  release_blocking: true
  evidence:
