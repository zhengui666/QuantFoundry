name: visual-baseline-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install locked frontend environment
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Generate unapproved Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend exec playwright test e2e/visual.spec.ts --update-snapshots
          pnpm --dir frontend exec playwright test e2e/golden.spec.ts --grep 'P15 memo' --update-snapshots
          test -n "$(find frontend/e2e -type f -name '*-linux.png' -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('frontend/e2e')
          files = sorted(path.relative_to(root).as_posix() for path in root.rglob('*-linux.png'))
          manifest = {
              'schema_version': '1.0.0',
              'content_type': 'application/vnd.quantfoundry.visual-baseline-candidate+json;version=1',
              'commit_sha': __import__('os').environ['GITHUB_SHA'],
              'workflow': 'visual-baseline-bootstrap',
              'approved': False,
              'files': [
                  {
                      'path': path,
                      'sha256': hashlib.sha256((root / path).read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          pathlib.Path('visual-baseline-candidate.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-baseline-bootstrap-${{ github.run_id }}
          path: |
            frontend/e2e/**/*-linux.png
            visual-baseline-candidate.json
          if-no-files-found: error
          retention-days: 14
