name: RC and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing controlled vMAJOR.MINOR.PATCH-alpha tag
        required: true
        type: string
      publish:
        description: Publish GHCR images and GitHub Release after RC gates
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
          else
            [[ "$GITHUB_REF_TYPE" == 'tag' ]]
            [[ "$GITHUB_REF" == "refs/tags/$tag" ]]
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$TAG" || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          remote_tag_object="$(git ls-remote --exit-code --refs origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"
          [[ "$tag_object" == "$remote_tag_object" ]]
          tag_target="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$tag_target" ]]
          [[ "$(git ls-remote --exit-code --refs origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')" == "$remote_tag_object" ]]
          printf 'commit=%s\n' "$tag_target" >> "$GITHUB_OUTPUT"
      - name: Require controlled tag and every release P0 closed
        env:
          QF_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pip install --disable-pip-version-check uv==0.10.7
          uv --directory backend sync --frozen --all-groups
          QF_RELEASE_TAG="$QF_RELEASE_TAG" make release-check | tee /tmp/p0-summary.json
          cp docs/治理/p0-blockers.yaml /tmp/p0-blockers.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-p0-registry-${{ github.run_id }}
          path: |
            /tmp/p0-summary.json
            /tmp/p0-blockers.yaml
          if-no-files-found: error

  rc-full-ci:
    needs: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
        env:
          POSTGRES_DB: quantfoundry
          POSTGRES_USER: quantfoundry
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quantfoundry -d quantfoundry"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QF_ENV: test
      QF_ENVIRONMENT: test
      QF_GIT_COMMIT: ${{ needs.release-preflight.outputs.commit }}
      QF_BUILD_ID: rc-${{ github.run_id }}-${{ github.run_attempt }}
      QF_DATABASE_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/quantfoundry
      QF_ALEMBIC_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/quantfoundry
      QF_SKIP_AUTO_CREATE: '1'
      QF_ARTIFACT_ROOT: /tmp/quantfoundry/artifacts
      QF_ARTIFACT_DIR: /tmp/quantfoundry/artifacts
      QF_DATA_ROOT: /tmp/quantfoundry/data
      QF_DATASET_DIR: /tmp/quantfoundry/data/datasets
      QF_COST_MODEL_DIR: /tmp/quantfoundry/data/cost-models
      QF_POLICY_DIR: /tmp/quantfoundry/data/policies
      QF_TOOL_CONTRACT_PATH: ${{ github.workspace }}/docs/后端系统技术方案/contracts/tools/v1-p0.yaml
      QF_AGENT_PROVIDER: local-deterministic
      QF_AGENT_MODEL: local-v1
      QF_ENABLE_LOCAL_DETERMINISTIC_PROVIDER: '1'
      QF_CREDENTIAL_ENCRYPTION_KEY_ID: ci-test-key-v1
      QF_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: quantfoundry
      PGPASSWORD: ci-only-not-a-secret
      PGGSSENCMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}
          fetch-depth: 0
      - name: Generate baseline only from tagged commit parent
        run: |
          git worktree add --detach /tmp/qf-linux-baseline "$(git rev-parse HEAD^)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked CI toolchains
        run: |
          pip install --disable-pip-version-check uv==0.10.7
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          uv --directory backend sync --frozen --all-groups
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
          cd /tmp/qf-linux-baseline/frontend
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
          pnpm exec playwright test e2e/golden.spec.ts --grep 'P15 memo' --update-snapshots
          cd e2e
          find . -type f -name '*-linux.png' -exec cp --parents '{}' "$GITHUB_WORKSPACE/frontend/e2e"/ \;
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint
          curl --fail --location --silent --show-error --output /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz' | sha256sum --check --strict
          tar --extract --xz --file /tmp/shellcheck.tar.xz --directory /tmp
          sudo install --mode 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: RC full gate
        env:
          RELEASE_EVIDENCE: /tmp/release-evidence
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-preflight.outputs.commit }}
        run: |
          mkdir -p /tmp/quantfoundry/artifacts /tmp/quantfoundry/data/datasets /tmp/quantfoundry/data/cost-models /tmp/quantfoundry/data/policies
          ./scripts/release-evidence.sh gate "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_EVIDENCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-evidence
          if-no-files-found: error

  publish:
    needs: [release-preflight, rc-full-ci]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}
          fetch-depth: 0
      - id: image
        run: echo "prefix=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: ${{ steps.image.outputs.prefix }}/backend:${{ needs.release-preflight.outputs.tag }}
          build-args: |
            QF_GIT_COMMIT=${{ needs.release-preflight.outputs.commit }}
            QF_BUILD_ID=${{ needs.release-preflight.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-preflight.outputs.commit }}
            org.opencontainers.image.version=${{ needs.release-preflight.outputs.tag }}
            io.quantfoundry.build-id=${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: ${{ steps.image.outputs.prefix }}/frontend:${{ needs.release-preflight.outputs.tag }}
          build-args: |
            QF_GIT_COMMIT=${{ needs.release-preflight.outputs.commit }}
            QF_BUILD_ID=${{ needs.release-preflight.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-preflight.outputs.commit }}
            org.opencontainers.image.version=${{ needs.release-preflight.outputs.tag }}
            io.quantfoundry.build-id=${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.prefix }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.prefix }}/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-evidence-*
          path: evidence
          merge-multiple: true
      - name: Bind published GHCR digests to rendered Compose images
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          ./scripts/release-evidence.sh compose-bind evidence \
            "$IMAGE_PREFIX/backend" "$BACKEND_DIGEST" \
            "$IMAGE_PREFIX/frontend" "$FRONTEND_DIGEST"
      - name: Archive signed provenance and OCI supply-chain records
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker buildx imagetools inspect "$IMAGE_PREFIX/backend@$BACKEND_DIGEST" --raw > evidence/backend-oci-index.json
          docker buildx imagetools inspect "$IMAGE_PREFIX/frontend@$FRONTEND_DIGEST" --raw > evidence/frontend-oci-index.json
          gh attestation verify "oci://$IMAGE_PREFIX/backend@$BACKEND_DIGEST" --repo "$GITHUB_REPOSITORY" --format json > evidence/backend-provenance.json
          gh attestation verify "oci://$IMAGE_PREFIX/frontend@$FRONTEND_DIGEST" --repo "$GITHUB_REPOSITORY" --format json > evidence/frontend-provenance.json
      - name: Create release evidence manifest and GitHub Release assets
        env:
          TAG: ${{ needs.release-preflight.outputs.tag }}
          COMMIT: ${{ needs.release-preflight.outputs.commit }}
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-evidence.sh manifest "$TAG" "$COMMIT" evidence \
            "$IMAGE_PREFIX/backend" "$BACKEND_DIGEST" \
            "$IMAGE_PREFIX/frontend" "$FRONTEND_DIGEST"
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /tmp/release-SHA256SUMS && mv /tmp/release-SHA256SUMS SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes evidence/*
