name: CI gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  linux-visual-baseline:
    name: trusted visual baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Select stable baseline revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          baseline_ref=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            baseline_ref="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            baseline_ref="$PUSH_BEFORE_SHA"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            baseline_ref="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          [[ "$baseline_ref" =~ ^[0-9a-f]{40}$ ]] || { echo 'A trusted ancestor visual baseline is required; use the bootstrap candidate workflow for an initial repository baseline.' >&2; exit 1; }
          [[ "$baseline_ref" != "$GITHUB_SHA" ]] || { echo 'Refusing to self-generate and self-approve the current visual baseline.' >&2; exit 1; }
          git cat-file -e "${baseline_ref}^{commit}"
          git merge-base --is-ancestor "$baseline_ref" "$GITHUB_SHA" || { echo 'Visual baseline must be an ancestor of the current revision.' >&2; exit 1; }
          git worktree add --detach /tmp/qf-linux-baseline "$baseline_ref"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Install pinned frontend toolchain
        working-directory: /tmp/qf-linux-baseline/frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Generate Linux visual baseline from stable revision
        working-directory: /tmp/qf-linux-baseline/frontend
        run: |
          pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
          pnpm exec playwright test e2e/golden.spec.ts \
            --grep 'P15 memo' --update-snapshots
      - name: Stage Linux visual baseline
        working-directory: /tmp/qf-linux-baseline/frontend/e2e
        run: |
          mkdir -p /tmp/qf-linux-snapshots
          find . -type f -name '*-linux.png' \
            -exec cp --parents '{}' /tmp/qf-linux-snapshots/ \;
          test -n "$(find /tmp/qf-linux-snapshots -type f -name '*-linux.png' -print -quit)"
      - name: Upload Linux visual baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-visual-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qf-linux-snapshots
          if-no-files-found: error
          retention-days: 7

  quality-and-contracts:
    name: ${{ github.event_name == 'pull_request' && 'PR fast gate' || github.event_name == 'schedule' && 'nightly gate' || 'main full gate' }}
    needs: linux-visual-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
        env:
          POSTGRES_DB: quantfoundry
          POSTGRES_USER: quantfoundry
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantfoundry -d quantfoundry"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QF_ENV: test
      QF_ENVIRONMENT: test
      QF_GIT_COMMIT: ${{ github.sha }}
      QF_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      QF_DATABASE_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/quantfoundry
      QF_ALEMBIC_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/quantfoundry
      QF_SKIP_AUTO_CREATE: "1"
      QF_ARTIFACT_ROOT: /tmp/quantfoundry/artifacts
      QF_ARTIFACT_DIR: /tmp/quantfoundry/artifacts
      QF_DATA_ROOT: /tmp/quantfoundry/data
      QF_DATASET_DIR: /tmp/quantfoundry/data/datasets
      QF_COST_MODEL_DIR: /tmp/quantfoundry/data/cost-models
      QF_POLICY_DIR: /tmp/quantfoundry/data/policies
      QF_TOOL_CONTRACT_PATH: ${{ github.workspace }}/docs/后端系统技术方案/contracts/tools/v1-p0.yaml
      QF_AGENT_PROVIDER: local-deterministic
      QF_AGENT_MODEL: local-v1
      QF_ENABLE_LOCAL_DETERMINISTIC_PROVIDER: "1"
      QF_CREDENTIAL_ENCRYPTION_KEY_ID: ci-test-key-v1
      QF_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: quantfoundry
      PGPASSWORD: ci-only-not-a-secret
      PGGSSENCMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Install pinned toolchains
        run: |
          pip install --disable-pip-version-check uv==0.10.7
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Install pinned platform linters
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint
          curl --fail --location --silent --show-error \
            --output /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz' \
            | sha256sum --check --strict
          tar --extract --xz --file /tmp/shellcheck.tar.xz --directory /tmp
          sudo install --mode 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          actionlint -version | grep --fixed-strings '1.7.12'
          shellcheck --version | grep --fixed-strings 'version: 0.11.0'
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium runtime
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Download Linux visual baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-visual-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/e2e
      - name: Create runtime directories
        run: >-
          mkdir -p
          /tmp/quantfoundry/artifacts
          /tmp/quantfoundry/data/datasets
          /tmp/quantfoundry/data/cost-models
          /tmp/quantfoundry/data/policies
      - name: Migration, fresh smoke, repeated PostgreSQL, contract and frontend gates
        run: |
          make governance
          make ci
      - name: Upload frontend gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/storybook-static
          if-no-files-found: warn
          retention-days: 7
