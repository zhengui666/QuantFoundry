name: independent-agent-test

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional published release tag to verify supply-chain evidence"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
        env:
          POSTGRES_DB: qf_ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_USER: quantfoundry
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U quantfoundry -d qf_ci_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QF_ENV: test
      QF_ENVIRONMENT: test
      QF_GIT_COMMIT: ${{ github.sha }}
      QF_BUILD_ID: independent-test-${{ github.run_id }}-${{ github.run_attempt }}
      QF_DATABASE_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/qf_ci_${{ github.run_id }}_${{ github.run_attempt }}
      QF_ALEMBIC_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/qf_ci_${{ github.run_id }}_${{ github.run_attempt }}
      QF_CI_DISPOSABLE_DATABASE: '1'
      QF_SKIP_AUTO_CREATE: '1'
      QF_ARTIFACT_ROOT: /tmp/quantfoundry/artifacts
      QF_ARTIFACT_DIR: /tmp/quantfoundry/artifacts
      QF_DATA_ROOT: /tmp/quantfoundry/data
      QF_DATASET_DIR: /tmp/quantfoundry/data/datasets
      QF_POLICY_DIR: /tmp/quantfoundry/data/policies
      QF_TOOL_CONTRACT_PATH: ${{ github.workspace }}/docs/后端系统技术方案/contracts/tools/v1-p0.yaml
      QF_AGENT_PROVIDER: local-deterministic
      QF_AGENT_MODEL: local-v1
      QF_ENABLE_LOCAL_DETERMINISTIC_PROVIDER: '1'
      QF_LOCAL_PROVIDER_API_KEY: ci-local-provider-key-v1-000000
      QF_CREDENTIAL_ENCRYPTION_KEY_ID: ci-test-key-v1
      QF_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      QF_CREDENTIAL_FINGERPRINT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: quantfoundry
      PGPASSWORD: ci-only-not-a-secret
      PGGSSENCMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4ca07ed0232104a3feddc427a2632d4646ece5a9
          path: trusted-verifier
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install committed environments and fixed CI tooling
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check uv==0.10.7
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          uv --directory backend sync --frozen --all-groups
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
          trusted-verifier/scripts/ci/install-shellcheck.sh
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint
      - name: Recreate trusted verifier after candidate installation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4ca07ed0232104a3feddc427a2632d4646ece5a
          path: trusted-verifier
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Run independent full test gate
        shell: bash
        env:
          QF_CI_REPORT_DIR: ${{ runner.temp }}/qf-independent-test
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-verifier"
          trusted_commit="4ca07ed0232104a3feddc427a2632d4646ece5a"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "$trusted_commit"
          QF_CI_REPO_ROOT="$GITHUB_WORKSPACE" QF_CI_TRUSTED_ROOT="$trusted_root" QF_CI_TRUSTED_COMMIT="$trusted_commit" \
            "$trusted_root/scripts/ci/run-gate.sh" main-full "$QF_CI_REPORT_DIR"
      - name: Verify published release supply-chain evidence
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          trusted_root="$GITHUB_WORKSPACE/trusted-verifier"
          trusted_commit="$(git -C "$trusted_root" rev-parse HEAD)"
          QF_RELEASE_REPO_ROOT="$GITHUB_WORKSPACE" \
          QF_RELEASE_TRUSTED_VERIFIER_ROOT="$trusted_root" \
          QF_RELEASE_TRUSTED_VERIFIER_COMMIT="$trusted_commit" \
            "$trusted_root/scripts/ci/supply-chain-review.sh" "$RELEASE_TAG" "$release_commit"
      - name: Produce P0 test evidence reports
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QF_P0_REGISTRY_PATH: ${{ github.workspace }}/docs/治理/p0-blockers.yaml
        run: |
          set -euo pipefail
          gate_result="$RUNNER_TEMP/qf-independent-test/result.json"
          test -f "$gate_result"
          evidence_commit="$GITHUB_SHA"
          if [[ -n "$RELEASE_TAG" ]]; then
            release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            test "$release_commit" = "$GITHUB_SHA"
            evidence_commit="$release_commit"
          fi
          uv --directory trusted-verifier/backend run --frozen python "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/build-p0-evidence.py" test "$evidence_commit" "$RUNNER_TEMP/qf-p0-test-evidence" --result-file "$gate_result"
          if [[ -n "$RELEASE_TAG" ]]; then
            mkdir -p "$RUNNER_TEMP/qf-independent-test"
            python3 - "$evidence_commit" "$RUNNER_TEMP/qf-independent-test/release-gate-result.json" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({
              "gate": "supply-chain-review",
              "commit": sys.argv[1],
              "result": "pass",
              "exit_code": 0,
              "steps": [{"command": "scripts/ci/supply-chain-review.sh", "result": "pass", "exit_code": 0}],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            uv --directory trusted-verifier/backend run --frozen python "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/build-p0-evidence.py" test "$evidence_commit" "$RUNNER_TEMP/qf-p0-test-evidence" \
              --blocker P0-SUPPLY-CHAIN-RELEASE-EVIDENCE \
              --result-file "$RUNNER_TEMP/qf-independent-test/release-gate-result.json"
          fi

          mkdir -p "$RUNNER_TEMP/qf-independent-test"
          if [[ -d "$RUNNER_TEMP/qf-p0-test-evidence" ]]; then
            cp -a "$RUNNER_TEMP/qf-p0-test-evidence"/. "$RUNNER_TEMP/qf-independent-test"/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-test-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qf-independent-test
          if-no-files-found: error
          retention-days: 14
