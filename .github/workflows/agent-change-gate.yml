name: agent-change-gate

on:
  pull_request:
    paths: ['AGENTS.md', 'PROJECT_BACKGROUND.md', 'backend/app/agent_runtime.py', 'backend/app/agent_runtime/**', 'backend/src/quantfoundry/agents/**', 'backend/workers/**', 'backend/pyproject.toml', 'backend/uv.lock', 'frontend/package.json', 'frontend/pnpm-lock.yaml', 'docs/Agent技术方案/**', 'docs/后端系统技术方案/contracts/tools/**', 'docs/治理/**', '.github/workflows/**', 'scripts/ci/**', 'scripts/ci.sh', 'scripts/release*', 'scripts/tool_contract_check.py']
  push:
    branches: [main]
    paths: ['AGENTS.md', 'PROJECT_BACKGROUND.md', 'backend/app/agent_runtime.py', 'backend/app/agent_runtime/**', 'backend/src/quantfoundry/agents/**', 'backend/workers/**', 'backend/pyproject.toml', 'backend/uv.lock', 'frontend/package.json', 'frontend/pnpm-lock.yaml', 'docs/Agent技术方案/**', 'docs/后端系统技术方案/contracts/tools/**', 'docs/治理/**', '.github/workflows/**', 'scripts/ci/**', 'scripts/ci.sh', 'scripts/release*', 'scripts/tool_contract_check.py']

concurrency:
  group: agent-change-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  trusted-independent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QF_TRUSTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.QF_TRUSTED_COMMIT }}
          fetch-depth: 1
      - name: Fetch and verify independent review from trusted checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QF_REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$QF_TRUSTED_COMMIT" =~ ^[0-9a-f]{40}$ && "$QF_TRUSTED_COMMIT" != "0000000000000000000000000000000000000000" ]]
          git fetch --no-tags origin "$QF_REVIEW_COMMIT"
          locator="$RUNNER_TEMP/independent-review-locator.json"
          attestation="$RUNNER_TEMP/independent-review-attestation.json"
          scripts/ci/fetch-independent-review-report.sh "$QF_REVIEW_COMMIT" "$locator"
          scripts/ci/verify-independent-review-report.sh "$locator" "$QF_REVIEW_COMMIT"
          python3 - "$locator" "$attestation" "$QF_REVIEW_COMMIT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          locator, output, commit = map(pathlib.Path, sys.argv[1:])
          payload = json.loads(locator.read_text(encoding="utf-8"))
          if payload.get("commit") != str(commit):
              raise SystemExit("trusted review locator commit mismatch")
          pathlib.Path(output).write_text(json.dumps({
              "schema_version": "1.0.0",
              "commit": str(commit),
              "locator_sha256": hashlib.sha256(locator.read_bytes()).hexdigest(),
              "result": "verified",
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-review-locator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/independent-review-locator.json
            ${{ runner.temp }}/independent-review-attestation.json
          if-no-files-found: error
          retention-days: 7

  agent-contract:
    needs: trusted-independent-review
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
        env:
          POSTGRES_DB: "qf_ci_${{ github.run_id }}_${{ github.run_attempt }}"
          POSTGRES_USER: quantfoundry
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quantfoundry -d qf_ci_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QF_TRUSTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      QF_ENV: test
      QF_ENVIRONMENT: test
      QF_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      QF_BUILD_ID: agent-${{ github.run_id }}-${{ github.run_attempt }}
      QF_DATABASE_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/qf_ci_${{ github.run_id }}_${{ github.run_attempt }}
      QF_ALEMBIC_URL: postgresql+psycopg://quantfoundry:ci-only-not-a-secret@localhost:5432/qf_ci_${{ github.run_id }}_${{ github.run_attempt }}
      QF_CI_DISPOSABLE_DATABASE: '1'
      QF_SKIP_AUTO_CREATE: '1'
      QF_ARTIFACT_ROOT: /tmp/quantfoundry/artifacts
      QF_ARTIFACT_DIR: /tmp/quantfoundry/artifacts
      QF_DATA_ROOT: /tmp/quantfoundry/data
      QF_DATASET_DIR: /tmp/quantfoundry/data/datasets
      QF_COST_MODEL_DIR: /tmp/quantfoundry/data/cost-models
      QF_POLICY_DIR: /tmp/quantfoundry/data/policies
      QF_TOOL_CONTRACT_PATH: ${{ github.workspace }}/docs/后端系统技术方案/contracts/tools/v1-p0.yaml
      QF_AGENT_PROVIDER: local-deterministic
      QF_AGENT_MODEL: local-v1
      QF_ENABLE_LOCAL_DETERMINISTIC_PROVIDER: '1'
      QF_CREDENTIAL_ENCRYPTION_KEY_ID: ci-test-key-v1
      QF_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      QF_CREDENTIAL_FINGERPRINT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: quantfoundry
      PGPASSWORD: ci-only-not-a-secret
      PGGSSENCMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QF_TRUSTED_COMMIT }}
          path: trusted-gate
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install committed environments and CI linters
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check uv==0.10.7
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          uv --directory backend sync --frozen --all-groups
          pnpm --dir frontend install --frozen-lockfile
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint
      - name: Recreate trusted gate after candidate installation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QF_TRUSTED_COMMIT }}
          path: trusted-gate
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Install trusted CI linters
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-gate"
          "$trusted_root/scripts/ci/install-shellcheck.sh"
          test -z "$(git -C "$trusted_root" status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: independent-review-locator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qf-independent-review
      - name: Run exact Tool and Agent contract gate
        shell: bash
        env:
          QF_CI_REPORT_DIR: ${{ runner.temp }}/qf-ci
          GITHUB_REPOSITORY: ${{ github.repository }}
          QF_INDEPENDENT_REVIEW_REPORT: ${{ runner.temp }}/qf-independent-review/independent-review-locator.json
          QF_CI_REPO_ROOT: ${{ github.workspace }}
          QF_CI_TRUSTED_ROOT: ${{ github.workspace }}/trusted-gate
          QF_CI_TRUSTED_COMMIT: ${{ env.QF_TRUSTED_COMMIT }}
        run: |
          set -euo pipefail
          "$QF_CI_TRUSTED_ROOT/scripts/ci/run-gate.sh" agent-change "$QF_CI_REPORT_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-change-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qf-ci
          if-no-files-found: error
          retention-days: 7
