name: p0-release-close-gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to verify"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.0
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Install committed verifier runtime
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check uv==0.10.7
          uv --directory backend sync --frozen --all-groups
          scripts/ci/install-shellcheck.sh
      - name: Verify fully closed P0 registry and release evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QF_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          tag_commit="$(git rev-parse "refs/tags/$QF_RELEASE_TAG^{commit}")"
          [[ -n "$tag_commit" ]]
          test "$(git rev-parse HEAD)" = "$tag_commit"
          release_root="$RUNNER_TEMP/qf-release-$tag_commit"
          git worktree add --detach "$release_root" "$tag_commit"
          trap 'git worktree remove --force "$release_root"' EXIT
          QF_RELEASE_CHECK_ROOT="$release_root" \
            QF_RELEASE_CHECK_VERIFIER_ROOT="$release_root" \
            "$GITHUB_WORKSPACE/scripts/release-check.sh" "$QF_RELEASE_TAG"
