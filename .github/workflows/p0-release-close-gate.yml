name: p0-release-close-gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to verify"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.0
      - name: Install committed verifier runtime
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check uv==0.10.7
          uv --directory backend sync --frozen --all-groups
      - name: Verify fully closed P0 registry and release evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QF_RELEASE_COMMIT: ${{ github.sha }}
          QF_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          tag_commit="$(git rev-list -n 1 "refs/tags/$QF_RELEASE_TAG")"
          [[ -n "$tag_commit" ]]
          scripts/p0-check.sh docs/治理/p0-blockers.yaml --require-closed
