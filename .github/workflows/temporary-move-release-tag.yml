name: temporary-move-release-tag

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA to receive v0.1.0-alpha"
        required: true
        type: string

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Force move release tag
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force v0.1.0-alpha "${TARGET_SHA}"
          git push origin "refs/tags/v0.1.0-alpha" --force
