name: Apply QuantFoundry foundation

on:
  push:
    branches:
      - codex/quantfoundry-nautilus-redesign
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantfoundry-foundation-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'bootstrap: apply QuantFoundry foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace legacy tree with the approved foundation
        shell: bash
        run: |
          set -euo pipefail
          cat .qf-bootstrap/part-* > /tmp/qf-foundation.b64
          base64 --decode /tmp/qf-foundation.b64 > /tmp/qf-foundation.tar.gz
          rm -rf backend frontend native deploy scripts
          rm -f compose.yml Makefile .env.example .dockerignore .gitignore
          rm -rf .github/workflows
          tar -xzf /tmp/qf-foundation.tar.gz -C .
          rm -rf .qf-bootstrap
          git add -A
          git config user.name 'QuantFoundry Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: establish QuantFoundry core foundation'
          git push origin HEAD:codex/quantfoundry-nautilus-redesign
