name: bootstrap-release-tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to replace"
        required: true
        type: string
      target:
        description: "Existing commit SHA to tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  replace-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Replace release tag
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${TAG}" = "v0.1.0-alpha"
          test "${TARGET}" = "939adb3618bb811d9d24dc18d5d02dc606bf4b25"
          git init .
          git config user.name "QuantFoundry Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${TARGET}"
          git push origin ":refs/tags/${TAG}" || true
          git tag -a "${TAG}" "${TARGET}" -m "QuantFoundry ${TAG}"
          git push origin "refs/tags/${TAG}"
