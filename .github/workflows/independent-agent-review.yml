name: independent-agent-review

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published alpha release tag to verify for supply-chain closure"
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4ca07ed0232104a3feddc427a2632d4646ece5a9
          path: trusted-verifier
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.0
      - name: Install fixed review tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/uv-bootstrap-requirements.txt
          uv_source="$(command -v uv)"
          sudo install --owner=root --group=root --mode=0755 "$uv_source" /usr/bin/uv
          [[ "$uv_source" == /usr/bin/uv ]] || rm -f -- "$uv_source"
          uv --directory trusted-verifier/backend sync --frozen --all-groups
          "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/install-shellcheck.sh"
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          install --mode 0755 /tmp/actionlint "$RUNNER_TEMP/actionlint"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Execute independent review criteria
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          ((${#workflow_files[@]} > 0))
          printf 'QF_ACTIONLINT_COMMAND=%s\n' "actionlint $(printf '%q ' "${workflow_files[@]}")" >> "$GITHUB_ENV"
          QF_RELEASE_GOVERNANCE_ROOT="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/release-governance-static-gate.sh"
          QF_RELEASE_GOVERNANCE_ROOT="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/p0-architecture-review.sh"
          actionlint "${workflow_files[@]}"
      - name: Produce unprivileged commit-bound review report
        shell: bash
        env:
          QF_REVIEW_ACTOR: ${{ github.actor }}
          QF_REVIEW_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qf-p0-review-input"
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/qf-p0-review-input/independent-review-report.json" "$QF_REVIEW_ACTOR" "$QF_REVIEW_TRIGGERING_ACTOR" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          commit, run_id, run_attempt, output, actor, triggering_actor = sys.argv[1:]
          reviewed_paths = [
              "AGENTS.md", "PROJECT_BACKGROUND.md", "Makefile", "backend/pyproject.toml", "backend/uv.lock",
              "backend/src/quantfoundry", "backend/app/agent_runtime.py", "backend/workers",
              "backend/alembic", "backend/alembic.ini", "backend/alembic_control.ini",
              "frontend/package.json", "frontend/pnpm-lock.yaml", "frontend/src", "docs/Agent技术方案",
              "docs/后端系统技术方案/contracts", "docs/治理", ".github/workflows", "scripts/ci",
              "scripts/ci.sh", "scripts/api_healthcheck.py", "scripts/p0-check.sh", "scripts/p0-check-test.sh",
              "scripts/tool_contract_check.py", "scripts/release-check.sh", "scripts/release-evidence.sh",
              "scripts/release-known-issues-check.sh",
          ]
          for path in reviewed_paths:
              if subprocess.run(["git", "cat-file", "-e", f"{commit}:{path}"]).returncode != 0:
                  raise SystemExit(f"reviewed path is missing at reviewed commit: {path}")
          scope = subprocess.check_output(["git", "ls-tree", "-r", "--full-tree", commit, "--", *reviewed_paths])
          report_commands = [
              {"command": "scripts/ci/release-governance-static-gate.sh", "result": "pass", "exit_code": 0},
              {"command": "scripts/ci/p0-architecture-review.sh", "result": "pass", "exit_code": 0},
              {"command": os.environ["QF_ACTIONLINT_COMMAND"].strip(), "result": "pass", "exit_code": 0},
          ]
          report = {
              "schema_version": "1.0.0",
              "content_type": "application/vnd.quantfoundry.independent-review+json;version=1",
              "commit": commit,
              "github_run_id": int(run_id),
              "github_run_attempt": int(run_attempt),
              "actor": actor,
              "triggering_actor": triggering_actor,
              "verifier_role": "Independent Review Agent",
              "result": "approved",
              "criteria": [
                  "Agent/governance change conforms to canonical contracts and fail-closed CI policy.",
                  "Independent review commands completed successfully on the reviewed commit.",
              ],
              "reviewed_paths": reviewed_paths,
              "review_scope_sha256": hashlib.sha256(scope).hexdigest(),
              "blocker_results": {
                  "P0-ARCHITECTURE-TARGET-LAYERS": {
                      "result": "pass",
                      "basis": ["scripts/ci/p0-architecture-review.sh"],
                  },
                  "P0-CI-REPRODUCIBILITY": {
                      "result": "pass",
                      "basis": [
                          "scripts/ci/release-governance-static-gate.sh",
                          "actionlint .github/workflows/*.yml",
                      ],
                  },
              },
              "commands": report_commands,
          }
          pathlib.Path(output).write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          pathlib.Path(output).with_name("gate-result.json").write_text(json.dumps({
              "gate": "independent-review", "commit": commit,
              "github_run_id": int(run_id), "github_run_attempt": int(run_attempt),
              "result": "pass", "exit_code": 0,
              "steps": report["commands"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-agent-review-input-${{ github.run_id }}
          path: ${{ runner.temp }}/qf-p0-review-input
          if-no-files-found: error
          retention-days: 14

  evidence:
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4ca07ed0232104a3feddc427a2632d4646ece5a9
          path: trusted-verifier
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.0
      - name: Install trusted evidence tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/uv-bootstrap-requirements.txt
          uv_source="$(command -v uv)"
          sudo install --owner=root --group=root --mode=0755 "$uv_source" /usr/bin/uv
          [[ "$uv_source" == /usr/bin/uv ]] || rm -f -- "$uv_source"
          uv --directory trusted-verifier/backend sync --frozen --all-groups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: independent-agent-review-input-${{ github.run_id }}
          path: ${{ runner.temp }}/qf-p0-review-evidence
      - name: Verify optional published release supply chain
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          export QF_RELEASE_REPO_ROOT="$GITHUB_WORKSPACE"
          export QF_RELEASE_TRUSTED_VERIFIER_ROOT="$GITHUB_WORKSPACE/trusted-verifier"
          trusted_verifier_commit="$(git -C "$QF_RELEASE_TRUSTED_VERIFIER_ROOT" rev-parse HEAD)"
          export QF_RELEASE_TRUSTED_VERIFIER_COMMIT="$trusted_verifier_commit"
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$release_commit" = "$GITHUB_SHA"
          "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/supply-chain-review.sh" "$RELEASE_TAG" "$release_commit"
          python3 - "$release_commit" "$RUNNER_TEMP/qf-p0-review-evidence/release-gate-result.json" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({
              "gate": "supply-chain-review",
              "commit": sys.argv[1],
              "github_run_id": int(sys.argv[3]),
              "github_run_attempt": int(sys.argv[4]),
              "result": "pass",
              "exit_code": 0,
              "steps": [{"command": "scripts/ci/supply-chain-review.sh", "result": "pass", "exit_code": 0}],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Build authenticated P0 evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QF_P0_REGISTRY_PATH: ${{ github.workspace }}/docs/治理/p0-blockers.yaml
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for blocker in P0-ARCHITECTURE-TARGET-LAYERS P0-CI-REPRODUCIBILITY; do
            uv --directory trusted-verifier/backend run --frozen python "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/build-p0-evidence.py" review "$GITHUB_SHA" "$RUNNER_TEMP/qf-p0-review-evidence" \
              --blocker "$blocker" \
              --result-file "$RUNNER_TEMP/qf-p0-review-evidence/gate-result.json"
          done
          if [[ -n "$RELEASE_TAG" ]]; then
            uv --directory trusted-verifier/backend run --frozen python "$GITHUB_WORKSPACE/trusted-verifier/scripts/ci/build-p0-evidence.py" review "$GITHUB_SHA" "$RUNNER_TEMP/qf-p0-review-evidence" \
              --blocker P0-SUPPLY-CHAIN-RELEASE-EVIDENCE \
              --result-file "$RUNNER_TEMP/qf-p0-review-evidence/release-gate-result.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-agent-review-${{ github.run_id }}
          path: ${{ runner.temp }}/qf-p0-review-evidence
          if-no-files-found: error
          retention-days: 14
