name: independent-agent-review

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published alpha release tag to verify for supply-chain closure"
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.0
      - name: Install fixed review tooling
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check uv==0.10.7
          uv --directory backend sync --frozen --all-groups
          scripts/ci/install-shellcheck.sh
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          install --mode 0755 /tmp/actionlint "$RUNNER_TEMP/actionlint"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Execute independent review criteria
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/release-governance-static-gate.sh
          bash -x scripts/ci/p0-architecture-review.sh
          actionlint .github/workflows/*.yml
      - name: Verify published release supply-chain evidence
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          scripts/ci/supply-chain-review.sh "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Produce commit-bound independent review report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qf-p0-review-evidence"
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/qf-p0-review-evidence/independent-review-report.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          commit, run_id, output = sys.argv[1:]
          reviewed_paths = [
              "AGENTS.md",
              "PROJECT_BACKGROUND.md",
              "backend/src/quantfoundry",
              "backend/workers",
              "docs/Agent技术方案",
              "docs/后端系统技术方案/contracts/tools",
              "docs/治理",
              ".github/workflows",
              "scripts/ci",
              "scripts/release-evidence.sh",
              "scripts/release-check.sh",
          ]
          scope = subprocess.check_output(["git", "ls-tree", "-r", "--full-tree", commit, "--", *reviewed_paths])
          report = {
              "schema_version": "1.0.0",
              "content_type": "application/vnd.quantfoundry.independent-review+json;version=1",
              "commit": commit,
              "github_run_id": int(run_id),
              "verifier_role": "Independent Review Agent",
              "result": "approved",
              "criteria": [
                  "Agent/governance change conforms to canonical contracts and fail-closed CI policy.",
                  "Independent review commands completed successfully on the reviewed commit.",
              ],
              "reviewed_paths": reviewed_paths,
              "review_scope_sha256": hashlib.sha256(scope).hexdigest(),
              "commands": [
                  {"command": "scripts/ci/release-governance-static-gate.sh", "result": "pass", "exit_code": 0},
                  {"command": "scripts/ci/p0-architecture-review.sh", "result": "pass", "exit_code": 0},
                  {"command": "actionlint .github/workflows/*.yml", "result": "pass", "exit_code": 0},
              ],
          }
          pathlib.Path(output).write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          uv --directory backend run --frozen python "$GITHUB_WORKSPACE/scripts/ci/build-p0-evidence.py" review "$GITHUB_SHA" "$RUNNER_TEMP/qf-p0-review-evidence" \
            --command "scripts/ci/release-governance-static-gate.sh" \
            --command "scripts/ci/p0-architecture-review.sh" \
            --command "actionlint .github/workflows/*.yml"
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            uv --directory backend run --frozen python "$GITHUB_WORKSPACE/scripts/ci/build-p0-evidence.py" review "$GITHUB_SHA" "$RUNNER_TEMP/qf-p0-review-evidence" \
              --blocker P0-SUPPLY-CHAIN-RELEASE-EVIDENCE \
              --command "scripts/ci/supply-chain-review.sh ${{ inputs.release_tag }} $GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-agent-review-${{ github.run_id }}
          path: ${{ runner.temp }}/qf-p0-review-evidence
          if-no-files-found: error
          retention-days: 14
